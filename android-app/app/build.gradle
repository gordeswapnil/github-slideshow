plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gordeswapnil.billsplitter'
    compileSdk 34

    defaultConfig {
        applicationId "com.gordeswapnil.billsplitter"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // Loaded from gradle.properties or environment.
            // The CI workflow generates a temporary keystore at build time
            // and writes these values via env vars / -P flags.
            // NB: local names must differ from the property names below
            // or Groovy parses `keyAlias keyAlias` as a method call.
            def ksFile     = System.getenv("KEYSTORE_PATH")     ?: project.findProperty("KEYSTORE_PATH")     ?: "keystore.jks"
            def ksPw       = System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD") ?: ""
            def aliasName  = System.getenv("KEY_ALIAS")         ?: project.findProperty("KEY_ALIAS")         ?: "hisaab"
            def keyPw      = System.getenv("KEY_PASSWORD")      ?: project.findProperty("KEY_PASSWORD")      ?: ""

            storeFile     file(ksFile)
            storePassword ksPw
            keyAlias      aliasName
            keyPassword   keyPw
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            // Android Gradle Plugin signs debug builds with the auto-generated debug keystore.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
