plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gordeswapnil.billsplitter'
    compileSdk 34

    defaultConfig {
        applicationId "com.gordeswapnil.billsplitter"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // Use explicit `=` assignment everywhere. Groovy's bare-token
            // form (e.g. `keyAlias foo`) is parsed as a method call which
            // can mis-resolve when the local var name overlaps the
            // property name. `=` is unambiguous.
            def ksFile    = System.getenv("KEYSTORE_PATH")     ?: project.findProperty("KEYSTORE_PATH")     ?: "keystore.jks"
            def ksPw      = System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD") ?: ""
            def aliasName = System.getenv("KEY_ALIAS")         ?: project.findProperty("KEY_ALIAS")         ?: "hisaab"
            def keyPw     = System.getenv("KEY_PASSWORD")      ?: project.findProperty("KEY_PASSWORD")      ?: ""

            storeFile     = file(ksFile)
            storePassword = ksPw
            keyAlias      = aliasName
            keyPassword   = keyPw
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            // Android Gradle Plugin signs debug builds with the auto-generated debug keystore.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
