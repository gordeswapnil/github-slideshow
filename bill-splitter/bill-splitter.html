  <style>
/* ===================================================================
   Bill Splitter — mobile-first stylesheet
   Palette mirrors the sample output (Shree Caterers reference).
   =================================================================== */

:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --ink:#1f2937;
  --muted:#6b7280;
  --line:#e5e7eb;
  --line-strong:#cbd5e1;
  --accent:#d84315;       /* primary orange (header) */
  --accent-dark:#a83310;
  --accent-soft:#fff1ec;
  --ok:#16a34a;
  --warn:#d97706;
  --err:#dc2626;

  /* per-person palette — order matches sample output */
  --p1:#1e63d9;  --p1-bg:#e8f0fc;   /* Pravin   blue   */
  --p2:#6a3fbf;  --p2-bg:#f0eaf9;   /* Vicky    purple */
  --p3:#1f8a3d;  --p3-bg:#e8f6ec;   /* Mahajan  green  */
  --p4:#d97706;  --p4-bg:#fdf2e3;   /* Swapnil  orange */
  --p5:#c2185b;  --p5-bg:#fceaf1;
  --p6:#0f766e;  --p6-bg:#defaf6;
  --p7:#4338ca;  --p7-bg:#ebe9fb;
  --p8:#a16207;  --p8-bg:#fbf4dd;

  --radius:12px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.05);
  --nav-h:64px;
  --bar-h:56px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; padding:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Helvetica Neue",sans-serif;
  overscroll-behavior-y:contain;
}
input,select,textarea,button{ font:inherit; color:inherit; }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input[type=number]{ -moz-appearance:textfield; }

/* ---------- App bar ---------- */
.appbar{
  position:sticky; top:0; left:0; right:0; height:var(--bar-h);
  background:var(--accent); color:#fff; z-index:20;
  display:flex; align-items:center; gap:8px; padding:0 8px;
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 2px rgba(0,0,0,.1);
}
.appbar-title{ font-size:18px; font-weight:600; margin:0; flex:1; text-align:center; letter-spacing:.2px; }
.iconbtn{
  background:transparent; border:0; color:#fff; width:40px; height:40px;
  border-radius:8px; font-size:20px;
}
.iconbtn:active{ background:rgba(255,255,255,.15); }

/* ---------- Main / screens ---------- */
main{
  min-height:calc(100vh - var(--bar-h) - var(--nav-h));
  padding:14px 14px calc(var(--nav-h) + 24px);
  max-width:760px; margin:0 auto;
}
.screen{ display:flex; flex-direction:column; gap:14px; animation:fade .18s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none} }
.screen h2{ margin:4px 0 0; font-size:20px; }
.section-title{ margin:14px 0 -4px; font-size:14px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
.muted{ color:var(--muted); font-size:13px; margin:0; }

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; height:var(--nav-h);
  background:#fff; border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(5,1fr);
  z-index:15; padding-bottom:env(safe-area-inset-bottom);
}
.navbtn{
  background:transparent; border:0; padding:6px 2px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; color:var(--muted); font-size:11px;
}
.navbtn .navico{ font-size:20px; }
.navbtn.active{ color:var(--accent); }

/* ---------- Buttons ---------- */
button.primary,button.ghost{
  border-radius:10px; padding:11px 16px; font-weight:600; font-size:15px;
  border:0; cursor:pointer;
}
button.primary{ background:var(--accent); color:#fff; }
button.primary:active{ background:var(--accent-dark); }
button.ghost{ background:#fff; color:var(--accent); border:1px solid var(--accent); }
button.ghost:active{ background:var(--accent-soft); }
button.big{ padding:14px 16px; font-size:16px; flex:1; }
button[disabled]{ opacity:.5; pointer-events:none; }

/* ---------- Cards / forms ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow);
}
.field{ display:flex; flex-direction:column; gap:4px; }
.field>span{ font-size:12px; color:var(--muted); font-weight:500; }
.field input,.field select{
  background:#fff; border:1px solid var(--line-strong); border-radius:8px;
  padding:10px 12px; font-size:15px; width:100%;
}
.field input:focus,.field select:focus{ outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
.field.inline{ flex-direction:row; align-items:center; justify-content:space-between; }
.field.inline>span{ flex:1; }
.field.inline>input{ max-width:120px; text-align:right; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* ---------- Hero / CTA ---------- */
.hero{ background:linear-gradient(135deg,var(--accent),#ef6c00); color:#fff; padding:18px; border-radius:var(--radius); }
.hero h2{ margin:0 0 4px; font-size:22px; }
.hero p{ margin:0; opacity:.92; font-size:14px; }
.cta-row{ display:flex; gap:10px; }

.saved-list{ display:flex; flex-direction:column; gap:8px; }
.saved-row{
  background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px;
  display:flex; align-items:center; gap:10px; box-shadow:var(--shadow);
}
.saved-row .meta{ flex:1; }
.saved-row .meta .title{ font-weight:600; }
.saved-row .meta .sub{ font-size:12px; color:var(--muted); }
.saved-row .amt{ font-weight:700; }
.saved-row .del{ background:transparent; border:0; color:var(--muted); font-size:18px; padding:6px; }

/* ---------- Item rows ---------- */
.seg{ display:flex; background:#fff; border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; }
.seg-btn{
  flex:1; background:transparent; border:0; padding:9px 6px; border-radius:8px;
  font-size:13px; font-weight:600; color:var(--muted);
}
.seg-btn.active{ background:var(--accent); color:#fff; }

.item-list{ display:flex; flex-direction:column; gap:8px; }
.item-row{
  background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:10px; display:flex; flex-direction:column; gap:8px; position:relative;
}
.item-row .it-name{ width:100%; padding:8px 10px; border:1px solid var(--line-strong); border-radius:8px; font-weight:600; }
.item-row-grid{ display:grid; grid-template-columns:1fr 70px 1fr; gap:8px; }
.item-row-grid label{ display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--muted); }
.item-row-grid input{ padding:8px 10px; border:1px solid var(--line-strong); border-radius:8px; text-align:right; width:100%; }
.delbtn{
  position:absolute; top:6px; right:6px;
  background:transparent; border:0; color:var(--muted); width:30px; height:30px; font-size:20px;
}
.delbtn:active{ color:var(--err); }

.taxcard{ gap:6px; }

.taxes-list{ display:flex; flex-direction:column; gap:8px; }
.tax-actions{ display:flex; gap:8px; }
.tax-actions button{ flex:1; }
.tip-presets{ display:flex; gap:8px; }
.tip-presets .tip-preset{ flex:1; }
.tax-row{
  background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:8px; display:grid; grid-template-columns:1fr 80px 1fr 30px; gap:6px; align-items:center;
}
.tax-row input, .tax-row select{
  padding:8px 10px; border:1px solid var(--line-strong); border-radius:8px; width:100%;
  font-size:13px;
}
.tax-row .tax-rate{ text-align:right; }
.tax-row .delbtn{ position:static; padding:0; width:30px; height:30px; }

/* Per-item "paid by" selector */
.it-paidby{ display:flex; align-items:center; gap:8px; font-size:12px; }
.it-paidby > span{ color:var(--muted); font-weight:500; }
.it-paidby-sel{
  flex:1; padding:6px 8px; border:1px solid var(--line-strong); border-radius:6px;
  background:#fff; font-size:13px;
}

/* Bill-level paid-by card */
.paid-by-card{
  background:#fff8f0; border-color:#fed7aa;
}
.paid-by-card .field > span{ color:#9a3412; font-weight:600; }
.paid-by-card #billPaidBy{
  padding:10px 12px; border:1px solid #fed7aa; border-radius:8px; font-size:15px;
  background:#fff;
}

/* Settlement panel */
.settle-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:0; box-shadow:var(--shadow); overflow:hidden; margin-top:14px;
}
.settle-card .settle-row{
  padding:11px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;
}
.settle-card .settle-row:last-child{ border-bottom:0; }
.settle-row .arrow{ color:var(--muted); }
.settle-row .from, .settle-row .to{ font-weight:700; }
.settle-row .amt{ margin-left:auto; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
.settle-empty{ padding:18px; text-align:center; color:var(--muted); }

/* Scan-warning banner */
.scan-warn-banner{
  background:#fffbeb; border:1px solid #fbbf24; border-radius:var(--radius);
  padding:10px 12px; font-size:13px; color:#78350f;
}
.scan-warn-banner .scan-warn-head{ font-weight:700; margin-bottom:4px; }
.scan-warn-banner ul{ margin:4px 0 6px 18px; padding:0; }
.scan-warn-banner .link-btn{ color:#78350f; text-decoration:underline; }

/* Item category section headers */
.cat-head{
  font-size:12px; font-weight:700; color:var(--muted); margin:8px 0 2px;
  text-transform:uppercase; letter-spacing:.4px;
}

/* Parcel chip on item row */
.parcel-chip{
  background:#fff; border:1px solid var(--line-strong); border-radius:14px;
  padding:4px 10px; font-size:12px; color:var(--muted); font-weight:600;
  cursor:pointer; align-self:flex-start;
}
.parcel-chip[aria-pressed="true"]{
  background:#fef3c7; border-color:#d97706; color:#92400e;
}

/* Item dietary tags */
.it-tags{ display:flex; gap:6px; flex-wrap:wrap; }
.tag-btn{
  background:#fff; border:1px solid var(--line-strong); border-radius:14px;
  padding:4px 10px; font-size:12px; color:var(--muted); font-weight:600;
}
.tag-btn[aria-pressed="true"][data-tag="veg"]    { background:#dcfce7; border-color:#16a34a; color:#166534; }
.tag-btn[aria-pressed="true"][data-tag="nonveg"] { background:#fee2e2; border-color:#dc2626; color:#991b1b; }
.tag-btn[aria-pressed="true"][data-tag="any"]    { background:#f3f4f6; border-color:#9ca3af; color:#374151; }
.tag-btn[aria-pressed="true"][data-tag="liquor"] { background:#fef3c7; border-color:#d97706; color:#92400e; }

/* Person preference pills */
.person-row{ flex-direction:column; align-items:stretch; padding:10px; gap:8px; }
.person-main{ display:flex; gap:10px; align-items:center; }
.person-prefs{ display:flex; gap:8px; padding-left:42px; flex-wrap:wrap; align-items:center; }

/* Diet tri-state segmented pill */
.diet-pill{
  display:inline-flex; border:1px solid var(--line-strong); border-radius:14px;
  background:#fff; padding:2px; gap:2px;
}
.diet-opt{
  background:transparent; border:0; padding:4px 9px; font-size:12px;
  border-radius:12px; color:var(--muted); font-weight:600; cursor:pointer;
}
.diet-opt.active[data-diet="veg"]    { background:#dcfce7; color:#166534; }
.diet-opt.active[data-diet="nonveg"] { background:#fee2e2; color:#991b1b; }
.diet-opt.active[data-diet="both"]   { background:#e0e7ff; color:#3730a3; }

.pref-btn{
  background:#fff; border:1px solid var(--line-strong); border-radius:14px;
  padding:4px 10px; font-size:12px; color:var(--muted); font-weight:600;
  display:inline-flex; align-items:center; gap:6px;
}
.pref-btn .pref-dot{ width:8px; height:8px; border-radius:50%; background:#cbd5e1; }
.pref-btn[aria-pressed="true"][data-pref="drink"] { background:#fef3c7; border-color:#d97706; color:#92400e; }
.pref-btn[aria-pressed="true"][data-pref="drink"] .pref-dot{ background:#d97706; }

/* Allocation: hint + quick actions */
.alloc-hint{ font-size:12px; color:var(--muted); }
.alloc-quick{ display:flex; gap:10px; flex-wrap:wrap; }
.link-btn{
  background:transparent; border:0; color:var(--accent); padding:2px 0;
  font-size:13px; font-weight:600; text-decoration:underline; cursor:pointer;
}
.alloc-prow .pchip.off{ opacity:.35; }

/* Quantity rule inputs */
.alloc-prow .pqtyrow{ display:flex; align-items:center; gap:6px; }
.alloc-prow .qty-step{
  width:28px; height:28px; border-radius:6px; background:#f3f4f6; border:1px solid var(--line-strong); font-weight:700;
}
.alloc-prow .qty-step:active{ background:#e5e7eb; }

.totals-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; box-shadow:var(--shadow); font-size:14px;
}
.totals-card .tline{ display:flex; justify-content:space-between; padding:3px 0; }
.totals-card .tline.grand{ border-top:1px solid var(--line); margin-top:4px; padding-top:8px; font-weight:700; font-size:16px; }

/* ---------- People ---------- */
.people-list{ display:flex; flex-direction:column; gap:8px; }
.person-row{
  background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:8px 10px; display:flex; gap:10px; align-items:center; position:relative;
}
.color-chip{
  width:32px; height:32px; border-radius:50%; border:2px solid #fff;
  box-shadow:0 0 0 1px var(--line-strong); flex:0 0 auto;
}
.person-row .pname{ flex:1; padding:8px 10px; border:1px solid var(--line-strong); border-radius:8px; }
.person-row .delbtn{ position:static; }

/* ---------- Allocate ---------- */
.alloc-list{ display:flex; flex-direction:column; gap:10px; }
.alloc-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;
}
.alloc-head{ display:flex; justify-content:space-between; align-items:baseline; }
.alloc-head .alloc-name{ font-weight:600; }
.alloc-head .alloc-amt{ font-weight:700; color:var(--accent); }
.alloc-rule{ padding:9px 10px; border:1px solid var(--line-strong); border-radius:8px; background:#fff; }
.alloc-people{ display:flex; flex-direction:column; gap:6px; }
.alloc-prow{ display:flex; align-items:center; gap:8px; }
.alloc-prow .pchip{ width:26px; height:26px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 1px var(--line-strong); position:relative; cursor:pointer; }
.alloc-prow .pchip.on::after{ content:"\2713"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; }
.alloc-prow .pname{ flex:1; font-size:14px; }
.alloc-prow .pinput{ width:90px; padding:6px 8px; border:1px solid var(--line-strong); border-radius:8px; text-align:right; }
.alloc-prow .pshare{ font-size:13px; color:var(--muted); width:80px; text-align:right; }
.alloc-status{ font-size:12px; color:var(--muted); }
.alloc-status.warn{ color:var(--err); font-weight:600; }
.alloc-status.ok{ color:var(--ok); }

.running{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; box-shadow:var(--shadow);
}
.running .rrow{ display:flex; justify-content:space-between; padding:3px 0; }
.running .rrow .pchip{ width:14px; height:14px; border-radius:50%; display:inline-block; margin-right:8px; vertical-align:middle; }

/* ---------- Result (export-ready) ---------- */
.result-view{ background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
.export-bar{
  display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px;
  position:sticky; bottom:calc(var(--nav-h) + 4px); padding-top:8px;
}
.export-bar button{ padding:11px 6px; font-size:13px; }

/* Share format picker modal */
.share-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.share-opt{
  background:#fff; border:1px solid var(--line-strong); border-radius:10px;
  padding:14px 10px; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; gap:3px; transition:transform .1s;
}
.share-opt:active{ transform:scale(.97); background:var(--accent-soft); border-color:var(--accent); }
.share-opt .share-ico{ font-size:28px; }
.share-opt .share-lbl{ font-weight:700; color:var(--ink); }
.share-opt .share-sub{ font-size:11px; color:var(--muted); }

/* ---- Layout that mirrors the sample PDF ---- */
.rpt{ font-size:13px; line-height:1.35; }
.rpt table{ width:100%; border-collapse:collapse; }
.rpt th,.rpt td{ padding:7px 8px; border-bottom:1px solid #e5e7eb; text-align:left; }
.rpt th{ background:#f1f5f9; font-weight:600; font-size:12px; color:#334155; }
.rpt td.num,.rpt th.num{ text-align:right; font-variant-numeric:tabular-nums; }
.rpt .ttl-band{
  background:var(--accent); color:#fff; padding:10px 12px; font-weight:600; font-size:15px;
  display:flex; justify-content:space-between; align-items:center;
}
.rpt .sub-band{
  padding:6px 12px; font-size:12px; color:#475569; background:#fafafa;
  display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between;
}
.rpt .grp{ background:#fef3ed; padding:6px 8px; font-weight:600; font-size:12px; color:#9a3412; }
.rpt .grp.liquor{ background:#fef2f2; color:#991b1b; }

  <!-- App -->
  <script>
/* ===================================================================
   store.js — localStorage persistence + in-memory state
   Schema:
     bills: [{ id, meta, items, taxes, people, allocations, createdAt }]
     settings: { apiKey?: string }
   =================================================================== */
(function (global) {
  'use strict';

  const KEY_BILLS    = 'bsp.bills.v1';
  const KEY_SETTINGS = 'bsp.settings.v1';
  const KEY_CURRENT  = 'bsp.current.v1';
  const KEY_USAGE    = 'bsp.usage.v1';     // [{ ts, costInr, costUsd, inTok, outTok }]

  const uid = () =>
    Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function blankBill() {
    return {
      id: uid(),
      createdAt: Date.now(),
      meta: {
        restName: '',
        restSub: '',
        billNo: '',
        billDate: '',
        billTable: '',
        billHall: '',
      },
      // section: 'food' | 'liquor' | 'other'
      // dietary (food items): 'any' | 'veg' | 'nonveg'
      // dietary (liquor items): always 'liquor'
      items: [],
      // Taxes are an arbitrary list — empty for a new bill, populated either
      // by OCR from a scanned bill or manually by the user.
      // Each tax: { id, name, rate, base }
      //   base: 'food'   → distributed proportionally to each person's food share
      //         'liquor' → liquor share
      //         'other'  → other share
      //         'all'    → total pre-tax share (e.g. service charge on full bill)
      taxes: [],
      // person: { id, name, color, prefs: { diet, isDrinker } }
      people: [],
      // Bill-level payer (single person who paid the whole bill at the
      // counter). If null, the bill is treated as Dutch at the counter.
      // Per-item `paidBy` can override this for specific items (e.g. an
      // ice-cream someone bought separately after the meal).
      paidBy: null,
      // map: itemId -> { rule, values }
      allocations: {},
    };
  }

  /** Migrate a legacy {cgst, sgst, vat} taxes object to the new array form. */
  function normaliseTaxes(taxes) {
    if (Array.isArray(taxes)) return taxes;
    if (!taxes || typeof taxes !== 'object') return [];
    const out = [];
    if (+taxes.cgst > 0) out.push({ id: 'cgst', name: 'CGST', rate: +taxes.cgst, base: 'food'   });
    if (+taxes.sgst > 0) out.push({ id: 'sgst', name: 'SGST', rate: +taxes.sgst, base: 'food'   });
    if (+taxes.vat  > 0) out.push({ id: 'vat',  name: 'VAT',  rate: +taxes.vat,  base: 'liquor' });
    return out;
  }

  /** Default person preferences.
   *  diet: 'both' (default — eats anything) | 'veg' (pure veg) | 'nonveg' (only non-veg)
   */
  function defaultPrefs() {
    return { diet: 'both', isDrinker: true };
  }

  /** Migrate legacy { isVeg: bool } to the new { diet } enum, in place. */
  function normalisePrefs(prefs) {
    if (!prefs) return defaultPrefs();
    if (prefs.diet) return prefs;
    // Old format: isVeg true → 'veg'; isVeg false → 'both' (eats anything)
    return {
      diet:      prefs.isVeg ? 'veg' : 'both',
      isDrinker: prefs.isDrinker !== false,
    };
  }

  /** Given an item and the people list, return the set of person ids that
      are eligible by dietary preference. Used to seed default allocations. */
  function eligiblePeople(item, people) {
    const tag = item && item.dietary;
    return people.filter((p) => {
      const prefs = normalisePrefs(p.prefs);
      if (tag === 'liquor') return prefs.isDrinker !== false;
      // Pure-veg people are excluded from non-veg items
      if (tag === 'nonveg') return prefs.diet !== 'veg';
      // Pure non-veg people (rare) are excluded from veg-only items
      if (tag === 'veg')    return prefs.diet !== 'nonveg';
      return true; // 'any' / undefined → everyone
    });
  }

  function loadBills() {
    try { return JSON.parse(localStorage.getItem(KEY_BILLS) || '[]'); }
    catch { return []; }
  }
  function saveBills(arr) {
    localStorage.setItem(KEY_BILLS, JSON.stringify(arr));
  }
  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(KEY_SETTINGS) || '{}'); }
    catch { return {}; }
  }
  function saveSettings(s) {
    localStorage.setItem(KEY_SETTINGS, JSON.stringify(s));
  }
  function loadCurrent() {
    try { return JSON.parse(localStorage.getItem(KEY_CURRENT) || 'null'); }
    catch { return null; }
  }
  function saveCurrent(bill) {
    if (!bill) localStorage.removeItem(KEY_CURRENT);
    else localStorage.setItem(KEY_CURRENT, JSON.stringify(bill));
  }

  function upsertBill(bill) {
    const all = loadBills();
    const idx = all.findIndex((b) => b.id === bill.id);
    if (idx >= 0) all[idx] = bill;
    else all.unshift(bill);
    saveBills(all);
  }
  function deleteBill(id) {
    saveBills(loadBills().filter((b) => b.id !== id));
  }

  // ---------- API-usage tracking (cost meter + monthly cap) ----------

  function loadUsage() {
    try { return JSON.parse(localStorage.getItem(KEY_USAGE) || '[]'); }
    catch { return []; }
  }
  function saveUsage(arr) {
    // Keep at most last 1000 events — bounds storage if user scans daily forever
    if (arr.length > 1000) arr = arr.slice(-1000);
    localStorage.setItem(KEY_USAGE, JSON.stringify(arr));
  }
  function recordUsage(usage) {
    if (!usage || !usage.costInr) return;
    const all = loadUsage();
    all.push({
      ts:    Date.now(),
      costInr: +usage.costInr.toFixed(4),
      costUsd: +usage.costUsd.toFixed(6),
      inTok:  usage.inputTokens,
      outTok: usage.outputTokens,
    });
    saveUsage(all);
  }
  /** Total INR spent in the current calendar month (local time). */
  function monthSpend() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    return loadUsage().reduce((s, e) => {
      const d = new Date(e.ts);
      return (d.getFullYear() === y && d.getMonth() === m) ? s + (e.costInr || 0) : s;
    }, 0);
  }
  function clearUsage() {
    localStorage.removeItem(KEY_USAGE);
  }

  global.Store = {
    uid,
    blankBill,
    defaultPrefs,
    normalisePrefs,
    normaliseTaxes,
    eligiblePeople,
    loadBills,
    saveBills,
    loadSettings,
    saveSettings,
    loadCurrent,
    saveCurrent,
    upsertBill,
    deleteBill,
    loadUsage,
    recordUsage,
    monthSpend,
    clearUsage,
  };
})(window);

</script>
  <script>
/* ===================================================================
   calculator.js — pure functions for splitting a bill.
   No DOM, no storage. Returned object is consumed by the renderer/exporter.

   PHILOSOPHY
   ----------
   1. Each item produces a per-person share array that sums (cents-exact) to
      its line total. Five rules supported: equal / assigned / percent / amount.
   2. Pre-tax subtotals per person are tallied per section (food / liquor / other).
   3. Each tax line is distributed proportionally to its base section's share.
      e.g. Food CGST is split in proportion to each person's Food pre-tax share;
      Liquor VAT in proportion to Liquor share; Others untaxed by default.
   4. Rounding residue (from 2dp truncation) is added back onto the person
      with the largest base — so the per-person totals reconcile exactly to
      the bill total. This is what the sample PDF means by "minor rounding".
   =================================================================== */
(function (global) {
  'use strict';

  const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;

  /** Compute total for an item: prefer explicit amount if rate*qty differs. */
  function itemTotal(item) {
    if (typeof item.amount === 'number' && !Number.isNaN(item.amount) && item.amount > 0) {
      return round2(item.amount);
    }
    return round2((item.rate || 0) * (item.qty || 0));
  }

  /**
   * Split a single item across people according to its allocation rule.
   * @returns { [personId]: shareInRupees }   — sums to itemTotal(item)
   */
  function splitItem(item, alloc, people) {
    const total = itemTotal(item);
    const shares = Object.fromEntries(people.map((p) => [p.id, 0]));
    if (total <= 0) return shares;

    const a = alloc || { rule: 'equal', values: {} };
    const rule = a.rule || 'equal';
    const values = a.values || {};

    if (rule === 'equal') {
      const ids = people.map((p) => p.id).filter((id) => values[id]);
      const list = ids.length ? ids : people.map((p) => p.id); // default: everyone
      const each = total / list.length;
      list.forEach((id) => (shares[id] = round2(each)));
      reconcile(shares, list, total);
      return shares;
    }

    if (rule === 'assigned') {
      const id = Object.keys(values).find((k) => values[k]);
      if (id && shares.hasOwnProperty(id)) shares[id] = total;
      return shares;
    }

    if (rule === 'percent') {
      const sumPct = Object.values(values).reduce((s, v) => s + (+v || 0), 0) || 100;
      const ids = [];
      Object.entries(values).forEach(([id, pct]) => {
        if (shares.hasOwnProperty(id) && +pct > 0) {
          shares[id] = round2(total * (+pct / sumPct));
          ids.push(id);
        }
      });
      reconcile(shares, ids, total);
      return shares;
    }

    if (rule === 'amount') {
      Object.entries(values).forEach(([id, amt]) => {
        if (shares.hasOwnProperty(id)) shares[id] = round2(+amt || 0);
      });
      // amount rule trusts the user; no reconciliation. (Validation flags mismatch.)
      return shares;
    }

    if (rule === 'quantity') {
      // values = { personId: qty }. Per-person amount = (qty / totalQty) * total.
      // If user entered no qty at all, fall back to equal split for safety.
      const totalQty = +item.qty || 0;
      const sumQty = Object.values(values).reduce((s, v) => s + (+v || 0), 0);
      const base = totalQty > 0 ? totalQty : sumQty;
      if (base <= 0) {
        const each = total / people.length;
        people.forEach((p) => (shares[p.id] = round2(each)));
        reconcile(shares, people.map((p) => p.id), total);
        return shares;
      }
      const ids = [];
      Object.entries(values).forEach(([id, qty]) => {
        if (shares.hasOwnProperty(id) && +qty > 0) {
          shares[id] = round2(total * (+qty / base));
          ids.push(id);
        }
      });
      reconcile(shares, ids, total);
      return shares;
    }

    if (rule === 'mixed') {
      // Hybrid of amount + quantity:
      //   values  = { personId: qty }      (qty share per person)
      //   amounts = { personId: ₹fixed }   (fixed amount per person)
      // Fixed amounts are paid first; the remainder of the line total is
      // distributed in proportion to qty values.
      const amounts = a.amounts || {};
      const fixedSum = Object.values(amounts).reduce((s, v) => s + (+v || 0), 0);
      const remainder = round2(total - fixedSum);
      // First: assign fixed amounts
      Object.entries(amounts).forEach(([id, amt]) => {
        if (shares.hasOwnProperty(id)) shares[id] = round2(+amt || 0);
      });
      // Then: split the remainder by qty (if any qty entered and remainder positive)
      const qtySum = Object.values(values).reduce((s, v) => s + (+v || 0), 0);
      if (qtySum > 0 && remainder > 0.005) {
        const ids = [];
        Object.entries(values).forEach(([id, qty]) => {
          if (shares.hasOwnProperty(id) && +qty > 0) {
            shares[id] = round2(shares[id] + remainder * (+qty / qtySum));
            ids.push(id);
          }
        });
        // Reconcile remainder rounding only across the qty-bearing payers
        const distributedSum = ids.reduce((s, id) => s + (shares[id] - (+amounts[id] || 0)), 0);
        const diff = round2(remainder - distributedSum);
        if (Math.abs(diff) >= 0.005 && ids.length) {
          let biggest = ids[0];
          ids.forEach((id) => { if ((+values[id] || 0) > (+values[biggest] || 0)) biggest = id; });
          shares[biggest] = round2(shares[biggest] + diff);
        }
      }
      return shares;
    }

    return shares;
  }

  /** Push rounding residue onto the largest share so the sum is exact. */
  function reconcile(shares, ids, target) {
    if (!ids.length) return;
    const sum = ids.reduce((s, id) => s + shares[id], 0);
    const diff = round2(target - sum);
    if (Math.abs(diff) < 0.005) return;
    // give residue to the largest payer for the most natural look
    let biggest = ids[0];
    ids.forEach((id) => { if (shares[id] > shares[biggest]) biggest = id; });
    shares[biggest] = round2(shares[biggest] + diff);
  }

  /** Human-readable label for a rule (used in the master table's "Split Rule" column). */
  function ruleLabel(item, alloc, people, shares) {
    if (!alloc) return 'Equal ÷ ' + people.length;
    const rule = alloc.rule;
    if (rule === 'equal') {
      const selected = people.filter((p) => alloc.values && alloc.values[p.id]);
      const n = selected.length || people.length;
      if (n === people.length) return 'Equal ÷ ' + n;
      return 'Equal ÷ ' + n + ' (' + selected.map((p) => p.name).join(', ') + ')';
    }
    if (rule === 'assigned') {
      const id = alloc.values && Object.keys(alloc.values).find((k) => alloc.values[k]);
      const who = people.find((p) => p.id === id);
      return '100% → ' + (who ? who.name : '?');
    }
    if (rule === 'percent') {
      return Object.entries(alloc.values || {})
        .filter(([, v]) => +v > 0)
        .map(([id, v]) => {
          const who = people.find((p) => p.id === id);
          return (who ? who.name : '?') + ': ' + v + '%';
        })
        .join(' + ');
    }
    if (rule === 'amount') {
      return Object.entries(shares || {})
        .filter(([, v]) => v > 0)
        .map(([id, v]) => {
          const who = people.find((p) => p.id === id);
          return (who ? who.name : '?') + ': ₹' + (+v).toFixed(0);
        })
        .join(' | ');
    }
    if (rule === 'quantity') {
      return Object.entries(alloc.values || {})
        .filter(([, v]) => +v > 0)
        .map(([id, v]) => {
          const who = people.find((p) => p.id === id);
          return (who ? who.name : '?') + ': ' + v;
        })
        .join(' + ') + ' qty';
    }
    if (rule === 'mixed') {
      const parts = [];
      const amounts = alloc.amounts || {};
      people.forEach((p) => {
        const q = +(alloc.values || {})[p.id] || 0;
        const a = +amounts[p.id] || 0;
        if (q > 0 || a > 0) {
          const bits = [];
          if (a > 0) bits.push('₹' + a.toFixed(0));
          if (q > 0) bits.push('qty ' + q);
          parts.push(p.name + ': ' + bits.join('+'));
        }
      });
      return parts.join(' | ') || '—';
    }
    return '—';
  }

  /**
   * Distribute a tax amount across people proportional to a per-person base.
   * @param tax    target total (₹) to distribute
   * @param base   { personId: baseAmount }
   * @returns      { personId: tax share }
   */
  function distributeTax(tax, base) {
    const ids = Object.keys(base);
    const sum = ids.reduce((s, id) => s + (base[id] || 0), 0);
    const out = Object.fromEntries(ids.map((id) => [id, 0]));
    if (sum <= 0 || tax <= 0) return out;
    ids.forEach((id) => { out[id] = round2(tax * (base[id] / sum)); });
    // reconcile to exact tax total
    const inSum = ids.reduce((s, id) => s + out[id], 0);
    const diff  = round2(tax - inSum);
    if (Math.abs(diff) >= 0.005) {
      let biggest = ids[0];
      ids.forEach((id) => { if (base[id] > base[biggest]) biggest = id; });
      out[biggest] = round2(out[biggest] + diff);
    }
    return out;
  }

  /**
   * Master compute function.
   * @returns {
   *   people, items, taxes,
   *   itemShares: { [itemId]: { [personId]: amount } },
   *   itemRules:  { [itemId]: ruleLabelString },
   *   itemTotals: { [itemId]: number },
   *   preTaxBySection: { food, liquor, other, total } by person,
   *   taxByPerson: { foodCgst, foodSgst, liquorVat } by person,
   *   taxTotals:   { food, liquorVat, foodCgst, foodSgst, foodTotal, liquorTotal, otherTotal },
   *   grand: { perPerson: {pid: total}, total }
   * }
   */
  function compute(bill) {
    const people = bill.people || [];
    const items  = bill.items  || [];
    // Taxes are always an array now; tolerate legacy object form by leaning on
    // Store.normaliseTaxes when it's available.
    const taxes  = Array.isArray(bill.taxes) ? bill.taxes
                  : (window.Store && window.Store.normaliseTaxes) ? window.Store.normaliseTaxes(bill.taxes)
                  : [];

    const itemShares = {};
    const itemRules  = {};
    const itemTotals = {};

    // Pre-tax subtotals by person, segmented by section
    const baseFood   = Object.fromEntries(people.map((p) => [p.id, 0]));
    const baseLiquor = Object.fromEntries(people.map((p) => [p.id, 0]));
    const baseOther  = Object.fromEntries(people.map((p) => [p.id, 0]));

    items.forEach((it) => {
      const alloc  = bill.allocations[it.id];
      const shares = splitItem(it, alloc, people);
      itemShares[it.id] = shares;
      itemTotals[it.id] = itemTotal(it);
      itemRules[it.id]  = ruleLabel(it, alloc, people, shares);
      const bucket = it.section === 'liquor' ? baseLiquor : it.section === 'other' ? baseOther : baseFood;
      people.forEach((p) => { bucket[p.id] = round2(bucket[p.id] + shares[p.id]); });
    });

    const foodSubtotal   = sum(baseFood);
    const liquorSubtotal = sum(baseLiquor);
    const otherSubtotal  = sum(baseOther);
    const baseAll        = Object.fromEntries(people.map((p) => [p.id,
      round2((baseFood[p.id] || 0) + (baseLiquor[p.id] || 0) + (baseOther[p.id] || 0))
    ]));

    // -----------------------------------------------------------
    // Generic tax distribution: each tax line is applied to its own
    // base (food / liquor / other / all), proportional to each person's
    // share of that base.
    // -----------------------------------------------------------
    function baseFor(t) {
      switch (t && t.base) {
        case 'food':   return baseFood;
        case 'liquor': return baseLiquor;
        case 'other':  return baseOther;
        case 'all':    return baseAll;
        default:       return baseFood;
      }
    }
    function baseSubtotalFor(t) {
      switch (t && t.base) {
        case 'food':   return foodSubtotal;
        case 'liquor': return liquorSubtotal;
        case 'other':  return otherSubtotal;
        case 'all':    return foodSubtotal + liquorSubtotal + otherSubtotal;
        default:       return foodSubtotal;
      }
    }

    // taxByPerson[personId][taxId]  = share of that tax for that person
    // taxTotals[taxId]              = total of that tax
    const taxByPerson = Object.fromEntries(people.map((p) => [p.id, {}]));
    const taxTotals   = {};
    taxes.forEach((t) => {
      const subtotal = baseSubtotalFor(t);
      const total    = round2(subtotal * (+t.rate || 0) / 100);
      taxTotals[t.id] = total;
      const distributed = distributeTax(total, baseFor(t));
      people.forEach((p) => { taxByPerson[p.id][t.id] = distributed[p.id] || 0; });
    });

    const grandPer = {};
    people.forEach((p) => {
      let g = (baseFood[p.id] || 0) + (baseLiquor[p.id] || 0) + (baseOther[p.id] || 0);
      taxes.forEach((t) => { g += taxByPerson[p.id][t.id] || 0; });
      grandPer[p.id] = round2(g);
    });
    const grandTotal = round2(sum(grandPer));

    // -----------------------------------------------------------
    // Paid-by / Settlement.
    //
    // Items with an explicit `paidBy` create a reimbursement loop:
    //   - the payer fronted the full (item + applicable tax)
    //   - every consumer (including the payer) owes their tax-inclusive
    //     share to that payer
    //
    // Items WITHOUT `paidBy` are assumed split at the counter — each
    // person pays their share directly to the merchant; no reimbursement
    // is generated for them.
    //
    // settlementConsumedPerPerson  = consumer's share, but only for
    //                                items that have a payer (gross of tax)
    // paidByPerson                 = total fronted by each payer (gross of tax)
    // net = settlementConsumedPerPerson − paidByPerson
    //   net > 0  → owes that much to the group of payers
    //   net < 0  → group owes them that much (they fronted more than they ate)
    // -----------------------------------------------------------
    // Sum of all tax rates that apply to a given section, used to grow each
    // item's "what the payer actually fronted" amount.
    function rateSumFor(section) {
      let r = 0;
      taxes.forEach((t) => {
        if (t.base === section || t.base === 'all') r += +t.rate || 0;
      });
      return r / 100;
    }
    const taxFactorFor = (section) => 1 + rateSumFor(section);
    const paidByPerson              = Object.fromEntries(people.map((p) => [p.id, 0]));
    const settlementConsumedPerPerson = Object.fromEntries(people.map((p) => [p.id, 0]));
    // effective payer = item.paidBy (override) ?? bill.paidBy (bill-level)
    const billPaidBy = bill.paidBy || null;
    items.forEach((it) => {
      const payer = it.paidBy || billPaidBy;
      if (!payer) return;                          // Dutch item, skip
      const tf      = taxFactorFor(it.section);
      const gross   = itemTotal(it) * tf;
      if (paidByPerson.hasOwnProperty(payer)) {
        paidByPerson[payer] = round2(paidByPerson[payer] + gross);
      }
      const shares = itemShares[it.id] || {};
      people.forEach((p) => {
        settlementConsumedPerPerson[p.id] = round2(
          settlementConsumedPerPerson[p.id] + (shares[p.id] || 0) * tf
        );
      });
    });
    const netPerPerson = Object.fromEntries(people.map((p) => [
      p.id,
      round2((settlementConsumedPerPerson[p.id] || 0) - (paidByPerson[p.id] || 0)),
    ]));
    const settlement = computeSettlement(people, netPerPerson);

    return {
      people, items, taxes,
      itemShares, itemRules, itemTotals,
      preTaxBySection: {
        food: baseFood, liquor: baseLiquor, other: baseOther,
        totals: { food: foodSubtotal, liquor: liquorSubtotal, other: otherSubtotal },
      },
      taxByPerson,
      taxTotals,
      grand: { perPerson: grandPer, total: grandTotal },
      paidByPerson,
      settlementConsumedPerPerson,
      netPerPerson,
      settlement,
    };
  }

  function sum(map) {
    return Object.values(map).reduce((s, v) => s + v, 0);
  }

  /**
   * Greedy settlement: given each person's net (positive = owes, negative =
   * is owed), produce a list of pairwise transfers that zero everyone out.
   * Algorithm: repeatedly pair the largest debtor with the largest creditor
   * and transfer min(|debt|, |credit|). Produces at most N-1 transfers for
   * N people — the minimum possible without splitting cents oddly.
   */
  function computeSettlement(people, netPerPerson) {
    const epsilon = 0.5;
    // Build mutable lists of debtors (>0) and creditors (<0)
    const debtors   = [];
    const creditors = [];
    people.forEach((p) => {
      const n = netPerPerson[p.id] || 0;
      if (n >  epsilon) debtors.push({ id: p.id, name: p.name, amount: n });
      if (n < -epsilon) creditors.push({ id: p.id, name: p.name, amount: -n });
    });
    debtors.sort((a, b)   => b.amount - a.amount);
    creditors.sort((a, b) => b.amount - a.amount);

    const transfers = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const pay = Math.min(debtors[i].amount, creditors[j].amount);
      transfers.push({
        fromId: debtors[i].id,   from: debtors[i].name,
        toId:   creditors[j].id, to:   creditors[j].name,
        amount: round2(pay),
      });
      debtors[i].amount   = round2(debtors[i].amount   - pay);
      creditors[j].amount = round2(creditors[j].amount - pay);
      if (debtors[i].amount   < epsilon) i++;
      if (creditors[j].amount < epsilon) j++;
    }
    return transfers;
  }

  /** Validation — returns array of human-readable warnings. */
  function validate(bill) {
    const out = [];
    // Surface OCR-side warnings as informational items so the user sees them
    // again on the Result screen even if they dismissed the banner.
    if (Array.isArray(bill._scanWarnings)) {
      bill._scanWarnings.forEach((w) => out.push('Scan: ' + w));
    }
    if (!bill.people || bill.people.length === 0) out.push('Add at least one person.');
    if (!bill.items  || bill.items.length  === 0) out.push('Add at least one item.');
    (bill.items || []).forEach((it) => {
      const t = itemTotal(it);
      if (t <= 0) out.push('Item "' + (it.name || 'untitled') + '" has zero amount.');
      const a = bill.allocations[it.id];
      if (a && a.rule === 'amount') {
        const s = round2(Object.values(a.values || {}).reduce((s, v) => s + (+v || 0), 0));
        if (Math.abs(s - t) >= 0.5) {
          out.push('"' + (it.name || 'item') + '": custom amounts sum to ₹' + s.toFixed(2) +
                   ' but item total is ₹' + t.toFixed(2) + '.');
        }
      }
      if (a && a.rule === 'percent') {
        const s = Object.values(a.values || {}).reduce((s, v) => s + (+v || 0), 0);
        if (s > 0 && Math.abs(s - 100) >= 0.5) {
          out.push('"' + (it.name || 'item') + '": percentages sum to ' + s + '% (need 100%).');
        }
      }
      if (a && a.rule === 'assigned') {
        const n = Object.values(a.values || {}).filter(Boolean).length;
        if (n === 0) out.push('"' + (it.name || 'item') + '": no person assigned.');
      }
      if (a && a.rule === 'quantity') {
        const totalQty = +it.qty || 0;
        const s = Object.values(a.values || {}).reduce((s, v) => s + (+v || 0), 0);
        if (totalQty > 0 && Math.abs(s - totalQty) >= 0.001) {
          out.push('"' + (it.name || 'item') + '": quantities sum to ' + s + ' but item qty is ' + totalQty + '.');
        }
        if (totalQty <= 0 && s <= 0) {
          out.push('"' + (it.name || 'item') + '": no quantities entered.');
        }
      }
      if (a && a.rule === 'mixed') {
        const fixedSum = Object.values(a.amounts || {}).reduce((s, v) => s + (+v || 0), 0);
        const qtySum   = Object.values(a.values  || {}).reduce((s, v) => s + (+v || 0), 0);
        if (fixedSum > t + 0.5) {
          out.push('"' + (it.name || 'item') + '": fixed amounts (₹' + fixedSum.toFixed(2) +
                   ') exceed item total ₹' + t.toFixed(2) + '.');
        }
        if (fixedSum < t - 0.5 && qtySum <= 0) {
          out.push('"' + (it.name || 'item') + '": ₹' + round2(t - fixedSum).toFixed(2) +
                   ' is unallocated — set a qty for the sharers or raise the fixed amounts.');
        }
        if (fixedSum === 0 && qtySum === 0) {
          out.push('"' + (it.name || 'item') + '": no qty or amount entered.');
        }
      }
    });
    return out;
  }

  global.Calc = { round2, itemTotal, compute, validate, splitItem, ruleLabel };
})(window);

</script>
  <script>
/* ===================================================================
   ocr.js — extract bill data from photo / PDF using Claude vision API.
   User provides an Anthropic API key (stored in localStorage). The app
   calls the Messages API directly from the browser; no backend.

   For PDF inputs, the first page is rendered to a PNG via pdf.js, then
   passed as an image.

   The model is asked to return strict JSON matching our bill schema.
   =================================================================== */
(function (global) {
  'use strict';

  const MODEL = 'claude-haiku-4-5';   // fast + cheap; plenty for OCR
  const ENDPOINT = 'https://api.anthropic.com/v1/messages';
  const TIMEOUT_MS = 45000;

  // Anthropic public pricing for claude-haiku-4-5 (USD per million tokens).
  // Used only for the in-app cost meter; kept in one place so it's easy to
  // update if pricing changes.
  const PRICE_INPUT_PER_MTOK_USD  = 1.00;
  const PRICE_OUTPUT_PER_MTOK_USD = 5.00;
  const USD_TO_INR = 85;   // rough; user can override in settings later

  function computeUsage(json) {
    const u = (json && json.usage) || {};
    const inputTokens  = +u.input_tokens  || 0;
    const outputTokens = +u.output_tokens || 0;
    const usd =
      (inputTokens  / 1e6) * PRICE_INPUT_PER_MTOK_USD +
      (outputTokens / 1e6) * PRICE_OUTPUT_PER_MTOK_USD;
    return {
      inputTokens, outputTokens,
      costUsd: usd,
      costInr: usd * USD_TO_INR,
    };
  }

  const SCHEMA_PROMPT = `You are a bill-extraction engine. Read the attached restaurant/party bill image and return STRICT JSON only — no prose, no markdown fences.

Use this exact shape:
{
  "meta": {
    "restName": "string",
    "restSub": "string (sub-title or location, may be empty)",
    "billNo": "string",
    "billDate": "YYYY-MM-DD",
    "billTable": "string",
    "billHall": "string (hall name + time, e.g. 'Garden 9:42 PM')",
    "restaurantType": "veg" | "nonveg" | "both" | "bar",
    "cuisine": "string (e.g. 'Indian', 'Chinese', 'Continental', 'Cafe')",
    "currency": "string (e.g. 'INR', 'USD' — default 'INR')"
  },
  "items": [
    { "name": "string",
      "rate": number,
      "qty": number,
      "amount": number,
      "section": "food" | "liquor" | "other",
      "dietary": "veg" | "nonveg" | "any" | "liquor",
      "category": "starter" | "main" | "dessert" | "beverage" | "drink" | "accompaniment" | "extra",
      "isParcel": boolean }
  ],
  "taxes": [
    { "name": "string (e.g. CGST, SGST, VAT, Service Charge)", "rate": number, "base": "food" | "liquor" | "other" | "all" }
  ],
  "warnings": [ "string" ],
  "hasServiceCharge": boolean
}

CRITICAL RULES — item extraction

1. MULTI-LINE ITEM NAMES. Restaurant receipts often wrap long item names across
   two or three text lines because of narrow columns. A single item is ALWAYS
   identified by the line that contains its qty AND its price; lines immediately
   above or below that — which contain ONLY text (no qty, no price) — belong to
   that item's name.

   Examples of wrapped names that MUST be combined into one item:
     "Sabudana"             ↘
     "Khichadi  1 100 100"  → one item: name "Sabudana Khichadi", qty 1, rate 100, amount 100
     "Maysur Masala"        ↘
     "Dosa      1 130 130"  → one item: name "Maysur Masala Dosa", qty 1, rate 130, amount 130
     "Kesari Bhath"         ↘
     "(sheera)  1 100 100"  → one item: name "Kesari Bhath (sheera)", qty 1, rate 100, amount 100

   NEVER emit an item whose qty or rate is invented from an adjacent row.

2. SANITY CHECK. After extracting items, sum their amounts. The sum MUST equal
   the bill's printed subtotal (pre-tax total). If they don't match, you have
   either split a wrapped name OR missed an item — re-read the receipt before
   answering.

3. SECTION ASSIGNMENT. Food → "food"; alcoholic drinks → "liquor"; service /
   guest charges / tips → "other".

4. NUMBERS. Plain JSON numbers, no commas, no currency symbols.

5. TAX FIELDS. The "taxes" array contains ONLY the taxes/charges that the bill
   actually prints. Do NOT add taxes that aren't on the receipt.
   - "rate" is a percentage (2.5, not 0.025). If only an amount is shown,
     compute rate as amount ÷ subtotal × 100.
   - "base" is the section the tax is computed on. CGST/SGST/GST on a food
     subtotal → "food". VAT/excise on alcohol → "liquor". A service charge on
     the entire bill → "all". A tax on the non-food/non-liquor subtotal → "other".
   - If the bill has NO taxes (rare), return "taxes": [].

6. RESTAURANT TYPE INFERENCE — use the restaurant's name and content to set
   meta.restaurantType and each item's dietary tag intelligently:
   - "VEG", "PURE VEG", "SHAKAHARI", "SATTVIC", "JAIN" in the restaurant name
     → restaurantType: "veg". EVERY food item's dietary MUST be "veg".
     The bill cannot contain liquor — do not emit any liquor items.
   - "NON-VEG", "MUTTON", "CHICKEN" obvious in the restaurant name
     → restaurantType: "nonveg". Tag each food item by its own type
     (chicken/mutton/fish/egg → "nonveg"; explicit veg dishes → "veg";
     ambiguous like dal/rice/roti → "any").
   - "BAR", "WINES", "DISTILLERY" prominent → restaurantType: "bar".
     Items in the LIQUOR section get dietary "liquor". Food items same logic
     as above for nonveg.
   - Otherwise → restaurantType: "both". Tag items individually.
   For every individual food item, when in doubt between veg/any, prefer "veg"
   if the dish is unambiguously vegetarian (idli, dosa, sambar, dal, paneer,
   khichadi, etc.). Use "nonveg" only for clearly non-veg dishes.

7. ITEM CATEGORY — tag each item with what KIND of dish it is, so the UI can
   group related items:
   - starter        : appetizers, soups, salads, papad, masala papad, pakoda, samosa
   - main           : biryani, curry, dal, rice, roti, naan, sabji, thali, dosa,
                      idli, khichadi, pasta, sandwich, burger — the bulk dish
   - dessert        : ice cream, kulfi, halwa, kheer, gulab jamun, kesari bhath, etc.
   - beverage       : water, soft drinks, juice, tea, coffee, lassi, butter milk
   - drink          : alcoholic only (overrides if item is in liquor section)
   - accompaniment  : pickle, raita, chutney, side salad
   - extra          : guest charges, paan, mints, anything that doesn't fit

8. PARCEL / TAKEAWAY DETECTION — set isParcel: true if the item line contains
   "PARCEL", "TO GO", "TAKE AWAY", "TAKEAWAY", "PACKED", or similar markers.
   These items typically belong to one person; the app will default such items
   to a single-person assignment.

9. MATH VALIDATION — before emitting your response, sum the item amounts and
   verify it equals the printed subtotal (pre-tax). If they DIFFER by more
   than 1 unit of currency, re-read the bill. If you still cannot reconcile,
   add a clear warning string to "warnings" describing the discrepancy
   (e.g. "Items sum to ₹453 but bill prints subtotal ₹455. Likely a missed
   item — please verify."). The "warnings" array MUST be empty when the
   numbers reconcile.

10. SERVICE CHARGE — set hasServiceCharge: true if the bill prints any line
    matching "Service Charge", "Service Tax", "Tip", "Gratuity", "Service Fee".
    Whether or not it's there, the user can add one in-app afterwards. If a
    service charge IS present, include it as one of the taxes (base "all" if
    on the whole bill, "food" if explicitly only on food).

11. CURRENCY — set meta.currency to the 3-letter ISO code (INR, USD, EUR,
    GBP, AED, etc.) based on the printed currency symbol or locale.
    Default to "INR" only if you genuinely cannot determine it.

12. Omit any field you genuinely cannot read; never invent values. Output ONE
    JSON object and nothing else.`;

  async function fileToImageBase64(file) {
    if (file.type === 'application/pdf') {
      return await pdfFirstPageToBase64(file);
    }
    // For ordinary photos we MUST downscale and re-encode:
    //   - Anthropic's vision endpoint rejects images > 5 MB base64
    //   - Modern phone cameras routinely produce 4-10 MB JPEGs even for a
    //     simple receipt photo
    //   - For OCR of a receipt, ~1800 px on the long edge is plenty; text
    //     is comfortably above the resolving threshold
    return await imageToCompressedBase64(file);
  }

  /** Resize + re-encode an image File so the API payload stays under 4 MB. */
  async function imageToCompressedBase64(file) {
    const MAX_LONG_EDGE = 1800;
    const TARGET_BYTES  = 4 * 1024 * 1024; // 4 MB leaves headroom for base64 expansion + JSON envelope

    // Step 1: load into an Image element
    const dataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload  = () => resolve(im);
      im.onerror = reject;
      im.src = dataUrl;
    });

    // Step 2: pick target dimensions
    let w = img.naturalWidth || img.width;
    let h = img.naturalHeight || img.height;
    const longEdge = Math.max(w, h);
    if (longEdge > MAX_LONG_EDGE) {
      const scale = MAX_LONG_EDGE / longEdge;
      w = Math.round(w * scale);
      h = Math.round(h * scale);
    }

    // Step 3: draw to canvas
    const canvas = document.createElement('canvas');
    canvas.width  = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    // White background — many JPEGs have implicit transparency that becomes
    // black on canvas; white is much friendlier for OCR contrast.
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);

    // Step 4: encode as JPEG at decreasing quality until under target size
    let quality = 0.85;
    let blob = await canvasToBlob(canvas, 'image/jpeg', quality);
    while (blob.size > TARGET_BYTES && quality > 0.4) {
      quality -= 0.15;
      blob = await canvasToBlob(canvas, 'image/jpeg', quality);
    }

    // Step 5: blob → base64 (strip the data:image/jpeg;base64, prefix)
    const finalDataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
    return { media: 'image/jpeg', data: finalDataUrl.split(',')[1] };
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise((resolve) => canvas.toBlob((b) => resolve(b), type, quality));
  }

  async function pdfFirstPageToBase64(file) {
    const mod = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs');
    mod.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';
    const buf = await file.arrayBuffer();
    const pdf = await mod.getDocument({ data: buf }).promise;
    const page = await pdf.getPage(1);
    // Pick a scale that keeps the long edge ~1800 px (same target as photos).
    const baseViewport = page.getViewport({ scale: 1 });
    const longEdge = Math.max(baseViewport.width, baseViewport.height);
    const scale = Math.min(2, 1800 / longEdge);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width  = Math.round(viewport.width);
    canvas.height = Math.round(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;

    // Encode as JPEG, dropping quality if the resulting payload is too big.
    let quality = 0.85;
    let blob = await canvasToBlob(canvas, 'image/jpeg', quality);
    while (blob.size > 4 * 1024 * 1024 && quality > 0.4) {
      quality -= 0.15;
      blob = await canvasToBlob(canvas, 'image/jpeg', quality);
    }
    const dataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
    return { media: 'image/jpeg', data: dataUrl.split(',')[1] };
  }

  async function extractFromFile(file, apiKey) {
    if (!apiKey) throw new Error('Add your Anthropic API key in the menu to enable scanning.');
    const img = await fileToImageBase64(file);

    const body = {
      model: MODEL,
      max_tokens: 2048,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: img.media, data: img.data } },
          { type: 'text',  text: SCHEMA_PROMPT },
        ],
      }],
    };

    // Inside the Android APK we hand the call to the Java bridge to bypass
    // WebView CORS restrictions on cross-origin browser fetch. In a plain
    // browser (or PWA) we fall back to fetch.
    const useBridge = (typeof window !== 'undefined'
        && window.HisaabNative
        && typeof window.HisaabNative.callAnthropic === 'function');
    const { text, raw } = useBridge
      ? await callViaBridge(apiKey, body)
      : await callViaFetch(apiKey, body);

    const parsed = parseJsonLoose(text);
    // Attach usage metadata so the caller can track cost without re-fetching.
    parsed._usage = computeUsage(raw);
    return parsed;
  }

  /** Browser fetch path (PWA / single-file build / dev). */
  async function callViaFetch(apiKey, body) {
    const ctl = new AbortController();
    const to  = setTimeout(() => ctl.abort(), TIMEOUT_MS);
    let res;
    try {
      res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify(body),
        signal: ctl.signal,
      });
    } catch (e) {
      clearTimeout(to);
      if (e.name === 'AbortError') {
        throw new Error('Scan timed out after ' + (TIMEOUT_MS / 1000) + 's. Check your internet connection.');
      }
      throw new Error('Network call to Claude failed (' + (e.message || e.name) + ').');
    }
    clearTimeout(to);
    if (!res.ok) {
      const t = await res.text();
      throw new Error('Claude API error ' + res.status + ': ' + t.slice(0, 300));
    }
    const json = await res.json();
    return {
      raw: json,
      text: (json.content || []).map((c) => c.text || '').join('').trim(),
    };
  }

  /** Android-only path via the WebAppInterface Java bridge. */
  function callViaBridge(apiKey, body) {
    return new Promise((resolve, reject) => {
      if (!window.HisaabBridge) {
        window.HisaabBridge = {
          _pending: Object.create(null),
          _resolve(id, resultJson) {
            const cb = this._pending[id];
            if (!cb) return;
            delete this._pending[id];
            try {
              const r = JSON.parse(resultJson);
              cb(r);
            } catch (e) {
              cb({ status: -1, error: 'Bridge returned malformed JSON' });
            }
          },
        };
      }
      const cbId = 'cb_' + Math.random().toString(36).slice(2);
      const timer = setTimeout(() => {
        if (window.HisaabBridge._pending[cbId]) {
          delete window.HisaabBridge._pending[cbId];
          reject(new Error('Scan timed out after ' + (TIMEOUT_MS / 1000) + 's.'));
        }
      }, TIMEOUT_MS);

      window.HisaabBridge._pending[cbId] = (r) => {
        clearTimeout(timer);
        if (r.status < 0) {
          reject(new Error('Network error: ' + (r.error || 'unknown')));
          return;
        }
        if (r.status < 200 || r.status >= 300) {
          reject(new Error('Claude API error ' + r.status + ': ' + (r.body || '').slice(0, 300)));
          return;
        }
        try {
          const j = JSON.parse(r.body);
          resolve({
            raw: j,
            text: (j.content || []).map((c) => c.text || '').join('').trim(),
          });
        } catch (e) {
          reject(new Error('Could not parse Claude response: ' + e.message));
        }
      };

      try {
        window.HisaabNative.callAnthropic(apiKey, JSON.stringify(body), cbId);
      } catch (e) {
        clearTimeout(timer);
        delete window.HisaabBridge._pending[cbId];
        reject(new Error('Failed to invoke native bridge: ' + (e.message || e)));
      }
    });
  }

  /** Strip code fences / extract first JSON object. */
  function parseJsonLoose(s) {
    let t = s.trim();
    t = t.replace(/^```(?:json)?\s*/i, '').replace(/```$/, '').trim();
    const start = t.indexOf('{');
    const end   = t.lastIndexOf('}');
    if (start >= 0 && end > start) t = t.slice(start, end + 1);
    return JSON.parse(t);
  }

  global.OCR = { extractFromFile };
})(window);

  <script>
/* ===================================================================
   exporter.js — render the result to a stand-alone HTML payload, then
   convert to PDF (via html2pdf) or PNG (via html2canvas) on demand.

   In the Android APK we route the final blob through the native bridge:
     - "save" → window.HisaabNative.saveToDownloads → public Downloads folder
     - "share" → window.HisaabNative.shareFile → Android share sheet
   In a plain browser / PWA we fall back to a normal <a download> click.

   The exported HTML is fully self-contained (inline CSS) so it opens
   correctly in any browser and looks identical to the sample.
   =================================================================== */
(function (global) {
  'use strict';

  function exportCss() {
    return `
      *{ box-sizing:border-box; }
      body{ margin:0; padding:24px; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; color:#1f2937; background:#fff; }

      .rpt td.num,.rpt th.num{ text-align:right; font-variant-numeric:tabular-nums; }
      .rpt .ttl-band{ background:#d84315; color:#fff; padding:12px 14px; font-weight:700; font-size:16px; text-align:center; }
      .rpt .sub-band{ padding:8px 14px; font-size:12px; color:#475569; background:#fafafa; text-align:center; font-style:italic; }
      .rpt .grp{ background:#fef3ed; padding:7px 10px; font-weight:700; font-size:12px; color:#9a3412; }
      .rpt .grp.liquor{ background:#fef2f2; color:#991b1b; }
      .rpt .grp.other{ background:#eff6ff; color:#1d4ed8; }
      .rpt .tax-row td{ background:#fffbeb; color:#92400e; font-style:italic; }
      .rpt .grand-row td{ background:#b91c1c; color:#fff; font-weight:800; font-size:14px; padding:12px 10px; }
      .rpt .person-band{ padding:11px 14px; font-weight:800; color:#fff; }
      .rpt .person-total td{ font-weight:800; background:#f8fafc; }
      .rpt .ftr{ padding:9px 14px; font-size:11px; color:#6b7280; font-style:italic; text-align:center; }
      .rpt + .rpt{ margin-top:18px; }
      .qp .qp-row{ display:grid; grid-template-columns:1fr 130px 100px; padding:11px 14px; align-items:center; border-bottom:1px solid #e5e7eb; }
      .qp .qp-row .qp-name{ font-weight:700; }
      .qp .qp-row .qp-amt,.qp .qp-row .qp-round{ font-variant-numeric:tabular-nums; text-align:right; }
      .qp .qp-row.qp-total{ background:#b91c1c; color:#fff; border:0; font-weight:800; }
      .qp .qp-head{ background:#f1f5f9; font-size:12px; color:#334155; font-weight:700; padding:8px 14px; display:grid; grid-template-columns:1fr 130px 100px; }
      .qp .qp-head>div:not(:first-child){ text-align:right; }
      @page{ size:A4; margin:14mm; }
    `;
  }

  function buildStandaloneHtml(bill, calc, renderFns) {
    const masterHtml = renderFns.renderMaster(bill, calc, { forExport: true });
    const personHtml = renderFns.renderPerPerson(bill, calc, { forExport: true });
    const quickHtml  = renderFns.renderQuickPay(bill, calc, { forExport: true });
    return `<!doctype html><html><head><meta charset="utf-8" />
<title>${escapeHtml(bill.meta.restName || 'Bill Split')} — Split</title>
<style>${exportCss()}</style></head>
<body>
  ${masterHtml}
  ${personHtml}
  ${quickHtml}
</body></html>`;
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );
  }

  function fileBaseName(bill) {
    const name = (bill.meta.restName || 'bill').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    const no   = (bill.meta.billNo || bill.id || '').toString().slice(-8);
    return [name, 'split', no].filter(Boolean).join('-');
  }

  function hasBridge() {
    return typeof window !== 'undefined'
      && window.HisaabNative
      && typeof window.HisaabNative.saveToDownloads === 'function';
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        const url = r.result || '';
        const comma = url.indexOf(',');
        resolve(comma >= 0 ? url.slice(comma + 1) : '');
      };
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  /** Setup the JS side of the bridge promise resolver if not yet set. */
  function ensureBridge() {
    if (window.HisaabBridge) return;
    window.HisaabBridge = {
      _pending: Object.create(null),
      _resolve(id, resultJson) {
        const cb = this._pending[id];
        if (!cb) return;
        delete this._pending[id];
        try { cb(JSON.parse(resultJson)); }
        catch (e) { cb({ ok: false, error: 'Bridge malformed JSON' }); }
      },
    };
  }

  /** Save a blob via the native bridge (Downloads folder) or, in a browser,
   *  fall back to the standard <a download> click. */
  async function saveBlob(blob, filename, mimeType) {
    if (hasBridge()) {
      ensureBridge();
      const base64 = await blobToBase64(blob);
      return new Promise((resolve, reject) => {
        const id = 'sv_' + Math.random().toString(36).slice(2);
        window.HisaabBridge._pending[id] = (r) => {
          if (r.ok) resolve(r);
          else reject(new Error(r.error || 'Save failed'));
        };
        try { window.HisaabNative.saveToDownloads(filename, mimeType, base64, id); }
        catch (e) { reject(new Error('Bridge call failed: ' + (e.message || e))); }
      });
    }
    // Browser fallback
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
    return { ok: true, path: filename };
  }

  /** Open Android's share sheet for the given blob. In a browser falls
   *  back to Web Share API when available, else a normal download. */
  async function shareBlob(blob, filename, mimeType) {
    if (hasBridge() && typeof window.HisaabNative.shareFile === 'function') {
      const base64 = await blobToBase64(blob);
      window.HisaabNative.shareFile(filename, mimeType, base64);
      return { ok: true };
    }
    // Browser: try Web Share with files
    if (navigator.canShare && navigator.share) {
      try {
        const file = new File([blob], filename, { type: mimeType });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          return { ok: true };
        }
      } catch (_) { /* user cancelled */ }
    }
    // Last resort: download
    return saveBlob(blob, filename, mimeType);
  }

  // ===================================================================
  //                     File-builder helpers
  // ===================================================================

  function buildHtmlBlob(bill, calc, renderFns) {
    const html = buildStandaloneHtml(bill, calc, renderFns);
    return new Blob([html], { type: 'text/html' });
  }

  /** Render the full report into a hidden div, return the holder. Caller
   *  must remove() it after html2canvas / html2pdf finishes. */
  function makeHolder(bill, calc, renderFns) {
    const html = buildStandaloneHtml(bill, calc, renderFns);
    const holder = document.createElement('div');
    holder.style.position = 'fixed';
    holder.style.left = '-99999px';
    holder.style.top = '0';
    holder.style.width = '820px';
    holder.style.background = '#fff';
    holder.innerHTML = html;
    document.body.appendChild(holder);
    return holder;
  }

  async function buildPdfBlob(bill, calc, renderFns) {
    if (!global.html2pdf) throw new Error('PDF library not loaded — check your internet connection.');
    const holder = makeHolder(bill, calc, renderFns);
    try {
      const worker = global.html2pdf().set({
        margin:      [10, 10, 10, 10],
        image:       { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true },
        jsPDF:       { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:   { mode: ['avoid-all', 'css', 'legacy'] },
      }).from(holder);
      return await worker.outputPdf('blob');
    } finally {
      holder.remove();
    }
  }

  async function buildPngBlob(bill, calc, renderFns) {
    let h2c = global.html2canvas;
    if (!h2c) {
      try {
        const mod = await import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm');
        h2c = mod.default || mod;
      } catch (_) {}
    }
    if (!h2c) throw new Error('Image library not loaded — check your internet connection.');
    const holder = makeHolder(bill, calc, renderFns);
    try {
      const canvas = await h2c(holder, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      return await new Promise((resolve) => canvas.toBlob((b) => resolve(b), 'image/png'));
    } finally {
      holder.remove();
    }
  }

  // ===================================================================
  //                  Public actions: save / share
  // ===================================================================

  async function exportHtml(bill, calc, renderFns) {
    const blob = buildHtmlBlob(bill, calc, renderFns);
    return saveBlob(blob, fileBaseName(bill) + '.html', 'text/html');
  }

  async function exportPdf(bill, calc, renderFns) {
    const blob = await buildPdfBlob(bill, calc, renderFns);
    return saveBlob(blob, fileBaseName(bill) + '.pdf', 'application/pdf');
  }

  async function exportPng(bill, calc, renderFns) {
    const blob = await buildPngBlob(bill, calc, renderFns);
    return saveBlob(blob, fileBaseName(bill) + '.png', 'image/png');
  }

  async function shareHtml(bill, calc, renderFns) {
    const blob = buildHtmlBlob(bill, calc, renderFns);
    return shareBlob(blob, fileBaseName(bill) + '.html', 'text/html');
  }
  async function sharePdf(bill, calc, renderFns) {
    const blob = await buildPdfBlob(bill, calc, renderFns);
    return shareBlob(blob, fileBaseName(bill) + '.pdf', 'application/pdf');
  }
  async function sharePng(bill, calc, renderFns) {
    const blob = await buildPngBlob(bill, calc, renderFns);
    return shareBlob(blob, fileBaseName(bill) + '.png', 'image/png');
  }

  function buildTextSummary(bill, calc) {
    const lines = [];
    lines.push(bill.meta.restName || 'Bill Split');
    if (bill.meta.billNo) lines.push('Bill: ' + bill.meta.billNo);
    if (bill.meta.billDate) lines.push('Date: ' + bill.meta.billDate);
    lines.push('');
    bill.people.forEach((p) => {
      const amt = (calc.grand.perPerson[p.id] || 0).toFixed(2);
      lines.push(p.name + ': ₹' + amt + '  (≈ ₹' + Math.round(calc.grand.perPerson[p.id] || 0) + ')');
    });
    lines.push('—');
    lines.push('Total: ₹' + calc.grand.total.toFixed(2));
    return lines.join('\n');
  }

  /** Quick text-only share via the native bridge (or Web Share / clipboard). */
  async function shareText(bill, calc) {
    const text = buildTextSummary(bill, calc);
    if (hasBridge() && typeof window.HisaabNative.shareText === 'function') {
      window.HisaabNative.shareText(text, bill.meta.restName || 'Bill Split');
      return 'shared';
    }
    if (navigator.share) {
      try { await navigator.share({ title: 'Bill Split', text }); return 'shared'; }
      catch (_) { return 'cancelled'; }
    }
    await navigator.clipboard.writeText(text);
    return 'copied';
  }

  global.Exporter = {
    exportHtml, exportPdf, exportPng,
    shareHtml,  sharePdf,  sharePng,  shareText,
    buildStandaloneHtml, buildTextSummary,
  };
})(window);
