  <style>
/* ===================================================================
   Bill Splitter — mobile-first stylesheet
   Palette mirrors the sample output (Shree Caterers reference).
   =================================================================== */

:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --ink:#1f2937;
  --muted:#6b7280;
  --line:#e5e7eb;
  --line-strong:#cbd5e1;
  --accent:#d84315;       /* primary orange (header) */
  --accent-dark:#a83310;
  --accent-soft:#fff1ec;
  --ok:#16a34a;
  --warn:#d97706;
  --err:#dc2626;

  /* per-person palette — order matches sample output */
  --p1:#1e63d9;  --p1-bg:#e8f0fc;   /* Pravin   blue   */
  --p2:#6a3fbf;  --p2-bg:#f0eaf9;   /* Vicky    purple */
  --p3:#1f8a3d;  --p3-bg:#e8f6ec;   /* Mahajan  green  */
  --p4:#d97706;  --p4-bg:#fdf2e3;   /* Swapnil  orange */
  --p5:#c2185b;  --p5-bg:#fceaf1;
  --p6:#0f766e;  --p6-bg:#defaf6;
  --p7:#4338ca;  --p7-bg:#ebe9fb;
  --p8:#a16207;  --p8-bg:#fbf4dd;

  --radius:12px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.05);
  --nav-h:64px;
  --bar-h:56px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; padding:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Helvetica Neue",sans-serif;
  overscroll-behavior-y:contain;
}
input,select,textarea,button{ font:inherit; color:inherit; }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input[type=number]{ -moz-appearance:textfield; }

/* ---------- App bar ---------- */
.appbar{
  position:sticky; top:0; left:0; right:0; height:var(--bar-h);
  background:var(--accent); color:#fff; z-index:20;
  display:flex; align-items:center; gap:8px; padding:0 8px;
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 2px rgba(0,0,0,.1);
}
.appbar-title{ font-size:18px; font-weight:600; margin:0; flex:1; text-align:center; letter-spacing:.2px; }
.iconbtn{
  background:transparent; border:0; color:#fff; width:40px; height:40px;
  border-radius:8px; font-size:20px;
}
.iconbtn:active{ background:rgba(255,255,255,.15); }

/* ---------- Main / screens ---------- */
main{
  min-height:calc(100vh - var(--bar-h) - var(--nav-h));
  padding:14px 14px calc(var(--nav-h) + 24px);
  max-width:760px; margin:0 auto;
}
.screen{ display:flex; flex-direction:column; gap:14px; animation:fade .18s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none} }
.screen h2{ margin:4px 0 0; font-size:20px; }
.section-title{ margin:14px 0 -4px; font-size:14px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
.muted{ color:var(--muted); font-size:13px; margin:0; }

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; height:var(--nav-h);
  background:#fff; border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(5,1fr);
  z-index:15; padding-bottom:env(safe-area-inset-bottom);
}
.navbtn{
  background:transparent; border:0; padding:6px 2px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; color:var(--muted); font-size:11px;
}
.navbtn .navico{ font-size:20px; }
.navbtn.active{ color:var(--accent); }

/* ---------- Buttons ---------- */
button.primary,button.ghost{
  border-radius:10px; padding:11px 16px; font-weight:600; font-size:15px;
  border:0; cursor:pointer;
}
button.primary{ background:var(--accent); color:#fff; }
button.primary:active{ background:var(--accent-dark); }
button.ghost{ background:#fff; color:var(--accent); border:1px solid var(--accent); }
button.ghost:active{ background:var(--accent-soft); }
button.big{ padding:14px 16px; font-size:16px; flex:1; }
button[disabled]{ opacity:.5; pointer-events:none; }

/* ---------- Cards / forms ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow);
}
.field{ display:flex; flex-direction:column; gap:4px; }
.field>span{ font-size:12px; color:var(--muted); font-weight:500; }
.field input,.field select{
  background:#fff; border:1px solid var(--line-strong); border-radius:8px;
  padding:10px 12px; font-size:15px; width:100%;
}
.field input:focus,.field select:focus{ outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
.field.inline{ flex-direction:row; align-items:center; justify-content:space-between; }
.field.inline>span{ flex:1; }
.field.inline>input{ max-width:120px; text-align:right; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* ---------- Hero / CTA ---------- */
.hero{ background:linear-gradient(135deg,var(--accent),#ef6c00); color:#fff; padding:18px; border-radius:var(--radius); }
.hero h2{ margin:0 0 4px; font-size:22px; }
.hero p{ margin:0; opacity:.92; font-size:14px; }
.cta-row{ display:flex; gap:10px; }

.saved-list{ display:flex; flex-direction:column; gap:8px; }
.saved-row{
  background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px;
  display:flex; align-items:center; gap:10px; box-shadow:var(--shadow);
}
.saved-row .meta{ flex:1; }
.saved-row .meta .title{ font-weight:600; }
.saved-row .meta .sub{ font-size:12px; color:var(--muted); }
.saved-row .amt{ font-weight:700; }
.saved-row .del{ background:transparent; border:0; color:var(--muted); font-size:18px; padding:6px; }

/* ---------- Item rows ---------- */
.seg{ display:flex; background:#fff; border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; }
.seg-btn{
  flex:1; background:transparent; border:0; padding:9px 6px; border-radius:8px;
  font-size:13px; font-weight:600; color:var(--muted);
}
.seg-btn.active{ background:var(--accent); color:#fff; }

.item-list{ display:flex; flex-direction:column; gap:8px; }
.item-row{
  background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:10px; display:flex; flex-direction:column; gap:8px; position:relative;
}
.item-row .it-name{ width:100%; padding:8px 10px; border:1px solid var(--line-strong); border-radius:8px; font-weight:600; }
.item-row-grid{ display:grid; grid-template-columns:1fr 70px 1fr; gap:8px; }
.item-row-grid label{ display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--muted); }
.item-row-grid input{ padding:8px 10px; border:1px solid var(--line-strong); border-radius:8px; text-align:right; width:100%; }
.delbtn{
  position:absolute; top:6px; right:6px;
  background:transparent; border:0; color:var(--muted); width:30px; height:30px; font-size:20px;
}
.delbtn:active{ color:var(--err); }

.taxcard{ gap:6px; }

.totals-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; box-shadow:var(--shadow); font-size:14px;
}
.totals-card .tline{ display:flex; justify-content:space-between; padding:3px 0; }
.totals-card .tline.grand{ border-top:1px solid var(--line); margin-top:4px; padding-top:8px; font-weight:700; font-size:16px; }

/* ---------- People ---------- */
.people-list{ display:flex; flex-direction:column; gap:8px; }
.person-row{
  background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:8px 10px; display:flex; gap:10px; align-items:center; position:relative;
}
.color-chip{
  width:32px; height:32px; border-radius:50%; border:2px solid #fff;
  box-shadow:0 0 0 1px var(--line-strong); flex:0 0 auto;
}
.person-row .pname{ flex:1; padding:8px 10px; border:1px solid var(--line-strong); border-radius:8px; }
.person-row .delbtn{ position:static; }

/* ---------- Allocate ---------- */
.alloc-list{ display:flex; flex-direction:column; gap:10px; }
.alloc-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;
}
.alloc-head{ display:flex; justify-content:space-between; align-items:baseline; }
.alloc-head .alloc-name{ font-weight:600; }
.alloc-head .alloc-amt{ font-weight:700; color:var(--accent); }
.alloc-rule{ padding:9px 10px; border:1px solid var(--line-strong); border-radius:8px; background:#fff; }
.alloc-people{ display:flex; flex-direction:column; gap:6px; }
.alloc-prow{ display:flex; align-items:center; gap:8px; }
.alloc-prow .pchip{ width:26px; height:26px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 1px var(--line-strong); position:relative; cursor:pointer; }
.alloc-prow .pchip.on::after{ content:"\2713"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; }
.alloc-prow .pname{ flex:1; font-size:14px; }
.alloc-prow .pinput{ width:90px; padding:6px 8px; border:1px solid var(--line-strong); border-radius:8px; text-align:right; }
.alloc-prow .pshare{ font-size:13px; color:var(--muted); width:80px; text-align:right; }
.alloc-status{ font-size:12px; color:var(--muted); }
.alloc-status.warn{ color:var(--err); font-weight:600; }
.alloc-status.ok{ color:var(--ok); }

.running{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; box-shadow:var(--shadow);
}
.running .rrow{ display:flex; justify-content:space-between; padding:3px 0; }
.running .rrow .pchip{ width:14px; height:14px; border-radius:50%; display:inline-block; margin-right:8px; vertical-align:middle; }

/* ---------- Result (export-ready) ---------- */
.result-view{ background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
.export-bar{
  display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px;
  position:sticky; bottom:calc(var(--nav-h) + 4px); padding-top:8px;
}
.export-bar button{ padding:11px 6px; font-size:13px; }

/* ---- Layout that mirrors the sample PDF ---- */
.rpt{ font-size:13px; line-height:1.35; }
.rpt table{ width:100%; border-collapse:collapse; }
.rpt th,.rpt td{ padding:7px 8px; border-bottom:1px solid #e5e7eb; text-align:left; }
.rpt th{ background:#f1f5f9; font-weight:600; font-size:12px; color:#334155; }
.rpt td.num,.rpt th.num{ text-align:right; font-variant-numeric:tabular-nums; }
.rpt .ttl-band{
  background:var(--accent); color:#fff; padding:10px 12px; font-weight:600; font-size:15px;
  display:flex; justify-content:space-between; align-items:center;
}
.rpt .sub-band{
  padding:6px 12px; font-size:12px; color:#475569; background:#fafafa;
  display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between;
}
.rpt .grp{ background:#fef3ed; padding:6px 8px; font-weight:600; font-size:12px; color:#9a3412; }
.rpt .grp.liquor{ background:#fef2f2; color:#991b1b; }
.rpt .grp.other{ background:#eff6ff; color:#1d4ed8; }
.rpt .tax-row td{ background:#fffbeb; color:#92400e; font-style:italic; }
.rpt .grand-row td{ background:#b91c1c; color:#fff; font-weight:700; font-size:14px; padding:11px 8px; }
.rpt .person-band{ padding:10px 12px; font-weight:700; color:#fff; }
.rpt .person-total td{ font-weight:700; background:#f8fafc; }
.rpt .ftr{ padding:8px 12px; font-size:11px; color:var(--muted); font-style:italic; text-align:center; }

/* Per-person color bands */
.pband-1{ background:var(--p1); } .pcard-1 .person-total td{ background:var(--p1-bg); color:var(--p1); }
.pband-2{ background:var(--p2); } .pcard-2 .person-total td{ background:var(--p2-bg); color:var(--p2); }
.pband-3{ background:var(--p3); } .pcard-3 .person-total td{ background:var(--p3-bg); color:var(--p3); }
.pband-4{ background:var(--p4); } .pcard-4 .person-total td{ background:var(--p4-bg); color:var(--p4); }
.pband-5{ background:var(--p5); } .pcard-5 .person-total td{ background:var(--p5-bg); color:var(--p5); }
.pband-6{ background:var(--p6); } .pcard-6 .person-total td{ background:var(--p6-bg); color:var(--p6); }
.pband-7{ background:var(--p7); } .pcard-7 .person-total td{ background:var(--p7-bg); color:var(--p7); }
.pband-8{ background:var(--p8); } .pcard-8 .person-total td{ background:var(--p8-bg); color:var(--p8); }

/* Master table column tints (header gets person color) */
.rpt th.h-1,.rpt td.c-1{ color:var(--p1); }
.rpt th.h-2,.rpt td.c-2{ color:var(--p2); }
.rpt th.h-3,.rpt td.c-3{ color:var(--p3); }
.rpt th.h-4,.rpt td.c-4{ color:var(--p4); }
.rpt th.h-5,.rpt td.c-5{ color:var(--p5); }
.rpt th.h-6,.rpt td.c-6{ color:var(--p6); }
.rpt th.h-7,.rpt td.c-7{ color:var(--p7); }
.rpt th.h-8,.rpt td.c-8{ color:var(--p8); }

/* ---- Quick pay card ---- */
.qp{ padding:0; }
.qp .qp-row{ display:grid; grid-template-columns:1fr auto auto; padding:11px 14px; align-items:center; border-bottom:1px solid var(--line); }
.qp .qp-row .qp-name{ font-weight:700; }
.qp .qp-row .qp-amt{ font-variant-numeric:tabular-nums; padding:0 12px; }
.qp .qp-row .qp-round{ font-variant-numeric:tabular-nums; font-weight:700; }
.qp .qp-row.qp-total{ background:#b91c1c; color:#fff; border:0; }

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:18px;
}
.modal{
  background:#fff; border-radius:var(--radius); max-width:420px; width:100%;
  padding:18px; display:flex; flex-direction:column; gap:12px; max-height:90vh; overflow:auto;
}
.modal h3{ margin:0; font-size:18px; }
.modal .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--nav-h) + 24px);
  background:#111827; color:#fff; padding:10px 16px; border-radius:24px;
  font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  z-index:40;
}
.toast.show{ opacity:.95; }

/* ---------- Color picker swatches ---------- */
.swatches{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.swatch{ height:44px; border-radius:8px; border:0; cursor:pointer; }

/* ---------- Misc ---------- */
.empty{
  text-align:center; color:var(--muted); font-size:14px;
  padding:24px 8px; border:1px dashed var(--line-strong); border-radius:10px;
}
.spinner{
  width:36px; height:36px; border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--accent);
  animation:spin 1s linear infinite; margin:0 auto;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* Wide-screen polish */
@media(min-width:760px){
  .item-row-grid{ grid-template-columns:1fr 90px 1fr; }
  .rpt{ font-size:14px; }
}

/* Print styles for export-quality output */
@media print{
  .appbar,.bottomnav,.export-bar,.seg{ display:none !important; }
  body{ background:#fff; }
  main{ padding:0; }
}

</style>
</head>
<body>

  <!-- ============== APP SHELL ============== -->
  <header class="appbar" id="appbar">
    <button class="iconbtn" id="backBtn" aria-label="Back" hidden>&larr;</button>
    <h1 class="appbar-title" id="appbarTitle">Bill Splitter</h1>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">&#9776;</button>
  </header>

  <main id="main"></main>

  <nav class="bottomnav" id="bottomnav">
    <button class="navbtn active" data-screen="home"><span class="navico">&#127968;</span><span>Bills</span></button>
    <button class="navbtn" data-screen="bill"><span class="navico">&#128221;</span><span>Items</span></button>
    <button class="navbtn" data-screen="people"><span class="navico">&#128101;</span><span>People</span></button>
    <button class="navbtn" data-screen="allocate"><span class="navico">&#9878;&#65039;</span><span>Allocate</span></button>
    <button class="navbtn" data-screen="result"><span class="navico">&#11088;</span><span>Result</span></button>
  </nav>

  <!-- ============== HIDDEN: SCREEN TEMPLATES ============== -->

  <template id="tpl-home">
    <section class="screen">
      <div class="hero">
        <h2>Welcome</h2>
        <p>Split any restaurant or party bill across people &mdash; with item-level rules, proportional taxes and one-tap export.</p>
      </div>
      <div class="cta-row">
        <button class="primary big" id="newBillBtn">+ New Bill</button>
        <button class="ghost big" id="scanBillBtn">&#128247; Scan Bill</button>
      </div>
      <input type="file" id="scanInput" accept="image/*,application/pdf" hidden />
      <h3 class="section-title">Saved Bills</h3>
      <div id="savedList" class="saved-list"></div>
    </section>
  </template>

  <template id="tpl-bill">
    <section class="screen">
      <h2>Bill Details</h2>
      <div class="card">
        <label class="field"><span>Restaurant name</span><input id="restName" placeholder="Shree Caterers" /></label>
        <label class="field"><span>Sub-title / location</span><input id="restSub" placeholder="Ladies Club" /></label>
        <div class="row2">

/* ===================================================================
   store.js — localStorage persistence + in-memory state
   Schema:
     bills: [{ id, meta, items, taxes, people, allocations, createdAt }]
     settings: { apiKey?: string }
   =================================================================== */
(function (global) {
  'use strict';

  const KEY_BILLS    = 'bsp.bills.v1';
  const KEY_SETTINGS = 'bsp.settings.v1';
  const KEY_CURRENT  = 'bsp.current.v1';

  const uid = () =>
    Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function blankBill() {
    return {
      id: uid(),
      createdAt: Date.now(),
      meta: {
        restName: '',
        restSub: '',
        billNo: '',
        billDate: '',
        billTable: '',
        billHall: '',
      },
      // section: 'food' | 'liquor' | 'other'
      items: [],
      // tax percentages
      taxes: { cgst: 2.5, sgst: 2.5, vat: 10 },
      people: [],
      // map: itemId -> { rule: 'equal'|'assigned'|'percent'|'amount', values: { personId: number } }
      // For 'equal': values = { personId: 1 } means person is included
      // For 'assigned': values = { personId: 1 } (one entry)
      // For 'percent': values = { personId: % } (sum to 100)
      // For 'amount': values = { personId: ₹ }   (sum to item total)
      allocations: {},
    };
  }

  function loadBills() {
    try { return JSON.parse(localStorage.getItem(KEY_BILLS) || '[]'); }
    catch { return []; }
  }
  function saveBills(arr) {
    localStorage.setItem(KEY_BILLS, JSON.stringify(arr));
  }
  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(KEY_SETTINGS) || '{}'); }
    catch { return {}; }
  }
  function saveSettings(s) {
    localStorage.setItem(KEY_SETTINGS, JSON.stringify(s));
  }
  function loadCurrent() {
    try { return JSON.parse(localStorage.getItem(KEY_CURRENT) || 'null'); }
    catch { return null; }
  }
  function saveCurrent(bill) {
    if (!bill) localStorage.removeItem(KEY_CURRENT);
    else localStorage.setItem(KEY_CURRENT, JSON.stringify(bill));
  }

  function upsertBill(bill) {
    const all = loadBills();
    const idx = all.findIndex((b) => b.id === bill.id);
    if (idx >= 0) all[idx] = bill;
    else all.unshift(bill);
    saveBills(all);
  }
  function deleteBill(id) {
    saveBills(loadBills().filter((b) => b.id !== id));
  }

  global.Store = {
    uid,
    blankBill,
    loadBills,
    saveBills,
    loadSettings,
    saveSettings,
    loadCurrent,
    saveCurrent,
    upsertBill,
    deleteBill,
  };
})(window);

</script>
  <script>
/* ===================================================================
   calculator.js — pure functions for splitting a bill.
   No DOM, no storage. Returned object is consumed by the renderer/exporter.

   PHILOSOPHY
   ----------
   1. Each item produces a per-person share array that sums (cents-exact) to
      its line total. Five rules supported: equal / assigned / percent / amount.
   2. Pre-tax subtotals per person are tallied per section (food / liquor / other).
   3. Each tax line is distributed proportionally to its base section's share.
      e.g. Food CGST is split in proportion to each person's Food pre-tax share;
      Liquor VAT in proportion to Liquor share; Others untaxed by default.
   4. Rounding residue (from 2dp truncation) is added back onto the person
      with the largest base — so the per-person totals reconcile exactly to
      the bill total. This is what the sample PDF means by "minor rounding".
   =================================================================== */
(function (global) {
  'use strict';

  const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;

  /** Compute total for an item: prefer explicit amount if rate*qty differs. */
  function itemTotal(item) {
    if (typeof item.amount === 'number' && !Number.isNaN(item.amount) && item.amount > 0) {
      return round2(item.amount);
    }
    return round2((item.rate || 0) * (item.qty || 0));
  }

  /**
   * Split a single item across people according to its allocation rule.
   * @returns { [personId]: shareInRupees }   — sums to itemTotal(item)
   */
  function splitItem(item, alloc, people) {
    const total = itemTotal(item);
    const shares = Object.fromEntries(people.map((p) => [p.id, 0]));
    if (total <= 0) return shares;

    const a = alloc || { rule: 'equal', values: {} };
    const rule = a.rule || 'equal';
    const values = a.values || {};

    if (rule === 'equal') {
      const ids = people.map((p) => p.id).filter((id) => values[id]);
      const list = ids.length ? ids : people.map((p) => p.id); // default: everyone
      const each = total / list.length;
      list.forEach((id) => (shares[id] = round2(each)));
      reconcile(shares, list, total);
      return shares;
    }

    if (rule === 'assigned') {
      const id = Object.keys(values).find((k) => values[k]);
      if (id && shares.hasOwnProperty(id)) shares[id] = total;
      return shares;
    }

    if (rule === 'percent') {
      const sumPct = Object.values(values).reduce((s, v) => s + (+v || 0), 0) || 100;
      const ids = [];
      Object.entries(values).forEach(([id, pct]) => {
        if (shares.hasOwnProperty(id) && +pct > 0) {
          shares[id] = round2(total * (+pct / sumPct));
          ids.push(id);
        }
      });
      reconcile(shares, ids, total);
      return shares;
    }

    if (rule === 'amount') {
      Object.entries(values).forEach(([id, amt]) => {
        if (shares.hasOwnProperty(id)) shares[id] = round2(+amt || 0);
      });
      // amount rule trusts the user; no reconciliation. (Validation flags mismatch.)
      return shares;
    }

    return shares;
  }

  /** Push rounding residue onto the largest share so the sum is exact. */
  function reconcile(shares, ids, target) {
    if (!ids.length) return;
    const sum = ids.reduce((s, id) => s + shares[id], 0);
    const diff = round2(target - sum);
    if (Math.abs(diff) < 0.005) return;
    // give residue to the largest payer for the most natural look
    let biggest = ids[0];
    ids.forEach((id) => { if (shares[id] > shares[biggest]) biggest = id; });
    shares[biggest] = round2(shares[biggest] + diff);
  }

  /** Human-readable label for a rule (used in the master table's "Split Rule" column). */
  function ruleLabel(item, alloc, people, shares) {
    if (!alloc) return 'Equal ÷ ' + people.length;
    const rule = alloc.rule;
    if (rule === 'equal') {
      const selected = people.filter((p) => alloc.values && alloc.values[p.id]);
      const n = selected.length || people.length;
      if (n === people.length) return 'Equal ÷ ' + n;
      return 'Equal ÷ ' + n + ' (' + selected.map((p) => p.name).join(', ') + ')';
    }
    if (rule === 'assigned') {
      const id = alloc.values && Object.keys(alloc.values).find((k) => alloc.values[k]);
      const who = people.find((p) => p.id === id);
      return '100% → ' + (who ? who.name : '?');
    }
    if (rule === 'percent') {
      return Object.entries(alloc.values || {})
        .filter(([, v]) => +v > 0)
        .map(([id, v]) => {
          const who = people.find((p) => p.id === id);
          return (who ? who.name : '?') + ': ' + v + '%';
        })
        .join(' + ');
    }
    if (rule === 'amount') {
      return Object.entries(shares || {})
        .filter(([, v]) => v > 0)
        .map(([id, v]) => {
          const who = people.find((p) => p.id === id);
          return (who ? who.name : '?') + ': ₹' + (+v).toFixed(0);
        })
        .join(' | ');
    }
    return '—';
  }

  /**
   * Distribute a tax amount across people proportional to a per-person base.
   * @param tax    target total (₹) to distribute
   * @param base   { personId: baseAmount }
   * @returns      { personId: tax share }
   */
  function distributeTax(tax, base) {
    const ids = Object.keys(base);
    const sum = ids.reduce((s, id) => s + (base[id] || 0), 0);
    const out = Object.fromEntries(ids.map((id) => [id, 0]));
    if (sum <= 0 || tax <= 0) return out;
    ids.forEach((id) => { out[id] = round2(tax * (base[id] / sum)); });
    // reconcile to exact tax total
    const inSum = ids.reduce((s, id) => s + out[id], 0);
    const diff  = round2(tax - inSum);
    if (Math.abs(diff) >= 0.005) {
      let biggest = ids[0];
      ids.forEach((id) => { if (base[id] > base[biggest]) biggest = id; });
      out[biggest] = round2(out[biggest] + diff);
    }
    return out;
  }

  /**
   * Master compute function.
   * @returns {
   *   people, items, taxes,
   *   itemShares: { [itemId]: { [personId]: amount } },
   *   itemRules:  { [itemId]: ruleLabelString },
   *   itemTotals: { [itemId]: number },
   *   preTaxBySection: { food, liquor, other, total } by person,
   *   taxByPerson: { foodCgst, foodSgst, liquorVat } by person,
   *   taxTotals:   { food, liquorVat, foodCgst, foodSgst, foodTotal, liquorTotal, otherTotal },
   *   grand: { perPerson: {pid: total}, total }
   * }
   */
  function compute(bill) {
    const people = bill.people || [];
    const items  = bill.items  || [];
    const taxes  = bill.taxes  || { cgst: 0, sgst: 0, vat: 0 };

    const itemShares = {};
    const itemRules  = {};
    const itemTotals = {};

    // Pre-tax subtotals by person, segmented by section
    const baseFood   = Object.fromEntries(people.map((p) => [p.id, 0]));
    const baseLiquor = Object.fromEntries(people.map((p) => [p.id, 0]));
    const baseOther  = Object.fromEntries(people.map((p) => [p.id, 0]));

    items.forEach((it) => {
      const alloc  = bill.allocations[it.id];
      const shares = splitItem(it, alloc, people);
      itemShares[it.id] = shares;
      itemTotals[it.id] = itemTotal(it);
      itemRules[it.id]  = ruleLabel(it, alloc, people, shares);
      const bucket = it.section === 'liquor' ? baseLiquor : it.section === 'other' ? baseOther : baseFood;
      people.forEach((p) => { bucket[p.id] = round2(bucket[p.id] + shares[p.id]); });
    });

    const foodSubtotal   = sum(baseFood);
    const liquorSubtotal = sum(baseLiquor);
    const otherSubtotal  = sum(baseOther);

    const foodCgstTotal = round2(foodSubtotal * (taxes.cgst || 0) / 100);
    const foodSgstTotal = round2(foodSubtotal * (taxes.sgst || 0) / 100);
    const liquorVatTotal = round2(liquorSubtotal * (taxes.vat  || 0) / 100);

    const foodCgst = distributeTax(foodCgstTotal,  baseFood);
    const foodSgst = distributeTax(foodSgstTotal,  baseFood);
    const liquorVat = distributeTax(liquorVatTotal, baseLiquor);

    const taxByPerson = Object.fromEntries(people.map((p) => [p.id, {
      foodCgst: foodCgst[p.id]  || 0,
      foodSgst: foodSgst[p.id]  || 0,
      liquorVat: liquorVat[p.id] || 0,
    }]));

    const grandPer = {};
    people.forEach((p) => {
      const g = round2(
        baseFood[p.id] + baseLiquor[p.id] + baseOther[p.id] +
        foodCgst[p.id] + foodSgst[p.id]   + liquorVat[p.id]
      );
      grandPer[p.id] = g;
    });
    const grandTotal = round2(sum(grandPer));

    return {
      people, items, taxes,
      itemShares, itemRules, itemTotals,
      preTaxBySection: {
        food: baseFood, liquor: baseLiquor, other: baseOther,
        totals: { food: foodSubtotal, liquor: liquorSubtotal, other: otherSubtotal },
      },
      taxByPerson,
      taxTotals: { foodCgst: foodCgstTotal, foodSgst: foodSgstTotal, liquorVat: liquorVatTotal },
      grand: { perPerson: grandPer, total: grandTotal },
    };
  }

  function sum(map) {
    return Object.values(map).reduce((s, v) => s + v, 0);
  }

  /** Validation — returns array of human-readable warnings. */
  function validate(bill) {
    const out = [];
    if (!bill.people || bill.people.length === 0) out.push('Add at least one person.');
    if (!bill.items  || bill.items.length  === 0) out.push('Add at least one item.');
    (bill.items || []).forEach((it) => {
      const t = itemTotal(it);
      if (t <= 0) out.push('Item "' + (it.name || 'untitled') + '" has zero amount.');
      const a = bill.allocations[it.id];
      if (a && a.rule === 'amount') {
        const s = round2(Object.values(a.values || {}).reduce((s, v) => s + (+v || 0), 0));
        if (Math.abs(s - t) >= 0.5) {
          out.push('"' + (it.name || 'item') + '": custom amounts sum to ₹' + s.toFixed(2) +
                   ' but item total is ₹' + t.toFixed(2) + '.');
        }
      }
      if (a && a.rule === 'percent') {
        const s = Object.values(a.values || {}).reduce((s, v) => s + (+v || 0), 0);
        if (s > 0 && Math.abs(s - 100) >= 0.5) {
          out.push('"' + (it.name || 'item') + '": percentages sum to ' + s + '% (need 100%).');
        }
      }
      if (a && a.rule === 'assigned') {
        const n = Object.values(a.values || {}).filter(Boolean).length;
        if (n === 0) out.push('"' + (it.name || 'item') + '": no person assigned.');
      }
    });
    return out;
  }

  global.Calc = { round2, itemTotal, compute, validate, splitItem, ruleLabel };
})(window);

</script>
  <script>
/* ===================================================================
   ocr.js — extract bill data from photo / PDF using Claude vision API.
   User provides an Anthropic API key (stored in localStorage). The app
   calls the Messages API directly from the browser; no backend.

   For PDF inputs, the first page is rendered to a PNG via pdf.js, then
   passed as an image.

   The model is asked to return strict JSON matching our bill schema.
   =================================================================== */
(function (global) {
  'use strict';

  const MODEL = 'claude-opus-4-7';
  const ENDPOINT = 'https://api.anthropic.com/v1/messages';

  const SCHEMA_PROMPT = `You are a bill-extraction engine. Read the attached restaurant/party bill image and return STRICT JSON only — no prose, no markdown fences.

Use this exact shape:
{
  "meta": {
    "restName": "string",
    "restSub": "string (sub-title or location, may be empty)",
    "billNo": "string",
    "billDate": "YYYY-MM-DD",
    "billTable": "string",
    "billHall": "string (hall name + time, e.g. 'Garden 9:42 PM')"
  },
  "items": [
    { "name": "string", "rate": number, "qty": number, "amount": number, "section": "food" | "liquor" | "other" }
  ],
  "taxes": { "cgst": number, "sgst": number, "vat": number }
}

RULES
- Section assignment: food items → "food", alcoholic drinks → "liquor", service/guest charges/tips → "other".
- Numbers must be plain JSON numbers (no commas, no currency symbols).
- Tax fields are PERCENTAGES (2.5 not 0.025). If the bill shows only amounts, infer percentages.
- Omit fields you cannot read; never invent values.
- Output ONE JSON object and nothing else.`;

  async function fileToImageBase64(file) {
    if (file.type === 'application/pdf') {
      return await pdfFirstPageToBase64(file);
    }
    return await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        const s = r.result;
        const comma = s.indexOf(',');
        resolve({ media: file.type || 'image/jpeg', data: s.slice(comma + 1) });
      };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  async function pdfFirstPageToBase64(file) {
    // pdf.js is loaded as an ES module on the page. Pull from the same CDN.
    const mod = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs');
    mod.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';
    const buf = await file.arrayBuffer();
    const pdf = await mod.getDocument({ data: buf }).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 2 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const dataUrl = canvas.toDataURL('image/png');
    return { media: 'image/png', data: dataUrl.split(',')[1] };
  }

  async function extractFromFile(file, apiKey) {
    if (!apiKey) throw new Error('Add your Anthropic API key in the menu to enable scanning.');
    const img = await fileToImageBase64(file);

    const body = {
      model: MODEL,
      max_tokens: 2048,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: img.media, data: img.data } },
          { type: 'text',  text: SCHEMA_PROMPT },
        ],
      }],
    };

    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const t = await res.text();
      throw new Error('Claude API error: ' + res.status + ' ' + t.slice(0, 200));
    }
    const json = await res.json();
    const text = (json.content || []).map((c) => c.text || '').join('').trim();
    return parseJsonLoose(text);
  }

  /** Strip code fences / extract first JSON object. */
  function parseJsonLoose(s) {
    let t = s.trim();
    t = t.replace(/^```(?:json)?\s*/i, '').replace(/```$/, '').trim();
    const start = t.indexOf('{');
    const end   = t.lastIndexOf('}');
    if (start >= 0 && end > start) t = t.slice(start, end + 1);
    return JSON.parse(t);
  }

  global.OCR = { extractFromFile };
})(window);

</script>

/* ===================================================================
   exporter.js — render the result to a stand-alone HTML payload, then
   convert to PDF (via html2pdf) or PNG (via html2canvas) on demand.

   The exported HTML is fully self-contained (inline CSS) so it opens
   correctly in any browser and looks identical to the sample.
   =================================================================== */
(function (global) {
  'use strict';

  /** Returns CSS used by the exported standalone HTML. */
  function exportCss() {
    return `
      *{ box-sizing:border-box; }
      body{ margin:0; padding:24px; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; color:#1f2937; background:#fff; }
      .rpt{ max-width:820px; margin:0 auto; border:1px solid #e5e7eb; border-radius:8px; overflow:hidden; }
      .rpt table{ width:100%; border-collapse:collapse; }

      .rpt td.num,.rpt th.num{ text-align:right; font-variant-numeric:tabular-nums; }
      .rpt .ttl-band{ background:#d84315; color:#fff; padding:12px 14px; font-weight:700; font-size:16px; text-align:center; }
      .rpt .sub-band{ padding:8px 14px; font-size:12px; color:#475569; background:#fafafa; text-align:center; font-style:italic; }
      .rpt .grp{ background:#fef3ed; padding:7px 10px; font-weight:700; font-size:12px; color:#9a3412; }
      .rpt .grp.liquor{ background:#fef2f2; color:#991b1b; }
      .rpt .grp.other{ background:#eff6ff; color:#1d4ed8; }
      .rpt .tax-row td{ background:#fffbeb; color:#92400e; font-style:italic; }
      .rpt .grand-row td{ background:#b91c1c; color:#fff; font-weight:800; font-size:14px; padding:12px 10px; }
      .rpt .person-band{ padding:11px 14px; font-weight:800; color:#fff; }
      .rpt .person-total td{ font-weight:800; background:#f8fafc; }
      .rpt .ftr{ padding:9px 14px; font-size:11px; color:#6b7280; font-style:italic; text-align:center; }
      .rpt + .rpt{ margin-top:18px; }
      .qp .qp-row{ display:grid; grid-template-columns:1fr 130px 100px; padding:11px 14px; align-items:center; border-bottom:1px solid #e5e7eb; }
      .qp .qp-row .qp-name{ font-weight:700; }
      .qp .qp-row .qp-amt,.qp .qp-row .qp-round{ font-variant-numeric:tabular-nums; text-align:right; }
      .qp .qp-row.qp-total{ background:#b91c1c; color:#fff; border:0; font-weight:800; }
      .qp .qp-head{ background:#f1f5f9; font-size:12px; color:#334155; font-weight:700; padding:8px 14px; display:grid; grid-template-columns:1fr 130px 100px; }
      .qp .qp-head>div:not(:first-child){ text-align:right; }
      @page{ size:A4; margin:14mm; }
    `;
  }

  /** Build the standalone HTML string for the full report (all 3 views). */
  function buildStandaloneHtml(bill, calc, renderFns) {
    const masterHtml   = renderFns.renderMaster(bill, calc, { forExport: true });
    const personHtml   = renderFns.renderPerPerson(bill, calc, { forExport: true });
    const quickHtml    = renderFns.renderQuickPay(bill, calc, { forExport: true });

    return `<!doctype html><html><head><meta charset="utf-8" />
<title>${escapeHtml(bill.meta.restName || 'Bill Split')} — Split</title>
<style>${exportCss()}</style></head>
<body>
  ${masterHtml}
  ${personHtml}
  ${quickHtml}
</body></html>`;
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
  }

  function fileBaseName(bill) {
    const name = (bill.meta.restName || 'bill').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    const no   = (bill.meta.billNo || bill.id || '').toString().slice(-8);
    return [name, 'split', no].filter(Boolean).join('-');
  }

  /** Export as standalone HTML file. */
  function exportHtml(bill, calc, renderFns) {
    const html = buildStandaloneHtml(bill, calc, renderFns);
    downloadBlob(new Blob([html], { type: 'text/html' }), fileBaseName(bill) + '.html');
    return html;
  }

  /** Export as PDF (via html2pdf — present on page). */
  async function exportPdf(bill, calc, renderFns) {
    if (!global.html2pdf) throw new Error('PDF library not loaded yet — try again in a moment.');
    const html = buildStandaloneHtml(bill, calc, renderFns);
    const holder = document.createElement('div');
    holder.style.position = 'fixed'; holder.style.left = '-99999px'; holder.style.top = '0';
    holder.style.width = '820px'; holder.style.background = '#fff';
    holder.innerHTML = html;
    document.body.appendChild(holder);
    try {
      await global.html2pdf().set({
        margin:      [10, 10, 10, 10],
        filename:    fileBaseName(bill) + '.pdf',
        image:       { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true },
        jsPDF:       { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:   { mode: ['avoid-all', 'css', 'legacy'] },
      }).from(holder).save();
    } finally {
      holder.remove();
    }
  }

  /** Export as PNG image (single tall image). html2canvas ships inside html2pdf bundle. */
  async function exportPng(bill, calc, renderFns) {
    let h2c = global.html2canvas;
    if (!h2c) {
      // Fallback: dynamic import from CDN
      const mod = await import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm');
      h2c = mod.default || mod;
    }
    if (!h2c) throw new Error('Image library not loaded yet — try again in a moment.');
    const html = buildStandaloneHtml(bill, calc, renderFns);
    const holder = document.createElement('div');
    holder.style.position = 'fixed'; holder.style.left = '-99999px'; holder.style.top = '0';
    holder.style.width = '820px'; holder.style.background = '#fff';
    holder.innerHTML = html;
    document.body.appendChild(holder);
    try {
      const canvas = await h2c(holder, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      await new Promise((resolve) => canvas.toBlob((blob) => {
        downloadBlob(blob, fileBaseName(bill) + '.png');
        resolve();
      }, 'image/png'));
    } finally {
      holder.remove();
    }
  }

  /** Web Share — falls back to copying a summary if share API absent. */
  async function shareSummary(bill, calc) {
    const lines = [];
    lines.push((bill.meta.restName || 'Bill Split'));
    if (bill.meta.billNo) lines.push('Bill: ' + bill.meta.billNo);
    if (bill.meta.billDate) lines.push('Date: ' + bill.meta.billDate);
    lines.push('');
    bill.people.forEach((p) => {
      const amt = (calc.grand.perPerson[p.id] || 0).toFixed(2);
      lines.push(p.name + ': ₹' + amt + '  (≈ ₹' + Math.round(calc.grand.perPerson[p.id] || 0) + ')');
    });
    lines.push('—');
    lines.push('Total: ₹' + calc.grand.total.toFixed(2));
    const text = lines.join('\n');
    if (navigator.share) {
      try { await navigator.share({ title: 'Bill Split', text }); return 'shared'; }
      catch (_) { /* user cancelled */ return 'cancelled'; }
    }
    await navigator.clipboard.writeText(text);
    return 'copied';
  }

  global.Exporter = { exportHtml, exportPdf, exportPng, shareSummary, buildStandaloneHtml };
})(window);

</script>
  <script>
/* ===================================================================
   app.js — UI controller. No frameworks; small templating helpers.
   ===================================================================
   Screens:  home  bill  people  allocate  result
   State lives in Store.loadCurrent() / saveCurrent().
   =================================================================== */
(function () {
  'use strict';

  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const fmt = (n) => (typeof n === 'number' ? n.toFixed(2) : '0.00');
  const fmtINR = (n) => '₹' + fmt(n);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // 8-slot palette (matches CSS vars); cycles beyond 8 with HSL fallback.
  const PALETTE = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'];
  const PALETTE_HEX = {
    p1: '#1e63d9', p2: '#6a3fbf', p3: '#1f8a3d', p4: '#d97706',
    p5: '#c2185b', p6: '#0f766e', p7: '#4338ca', p8: '#a16207',
  };
  const PALETTE_BG = {
    p1: '#e8f0fc', p2: '#f0eaf9', p3: '#e8f6ec', p4: '#fdf2e3',
    p5: '#fceaf1', p6: '#defaf6', p7: '#ebe9fb', p8: '#fbf4dd',
  };

  function colorFor(slot, fallbackIndex = 0) {
    if (slot && PALETTE_HEX[slot]) return PALETTE_HEX[slot];
    // beyond 8 people, generate from index
    const h = (fallbackIndex * 47) % 360;
    return `hsl(${h} 65% 42%)`;
  }
  function bgFor(slot, fallbackIndex = 0) {
    if (slot && PALETTE_BG[slot]) return PALETTE_BG[slot];
    const h = (fallbackIndex * 47) % 360;
    return `hsl(${h} 65% 92%)`;
  }
  function slotIndex(slot, fallbackIndex = 0) {
    const idx = PALETTE.indexOf(slot);
    return idx >= 0 ? idx + 1 : (fallbackIndex % 8) + 1;
  }

  // ============== Global app state =============

  const App = {
    bill: null,          // active bill
    screen: 'home',      // current screen id
    section: 'food',     // current section tab on Bill screen
    resultView: 'master',
  };

  function setBill(b) { App.bill = b; Store.saveCurrent(b); }
  function persist()  { if (App.bill) { Store.saveCurrent(App.bill); Store.upsertBill(App.bill); } }

  // ============== Toasts =============

  function toast(msg, ms = 1800) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
  }

  // ============== Modal =============

  function openModal(content) {
    const root = $('#modalRoot');
    const back = document.createElement('div'); back.className = 'modal-backdrop';
    const box  = document.createElement('div'); box.className = 'modal';
    box.innerHTML = content;
    back.appendChild(box);
    root.appendChild(back);
    back.addEventListener('click', (e) => { if (e.target === back) back.remove(); });
    return { back, box, close: () => back.remove() };
  }

  // ============== Routing =============

  function go(screen) {
    if (screen !== 'home' && !App.bill) {
      // any screen except home needs an active bill
      App.bill = Store.blankBill();
      setBill(App.bill);
    }
    App.screen = screen;
    $$('.navbtn').forEach((b) => b.classList.toggle('active', b.dataset.screen === screen));
    const tplId = 'tpl-' + screen;
    const node  = $('#' + tplId).content.firstElementChild.cloneNode(true);
    $('#main').replaceChildren(node);
    $('#backBtn').hidden = screen === 'home';
    $('#appbarTitle').textContent = ({
      home: 'Bill Splitter', bill: 'Bill Details', people: 'People',
      allocate: 'Allocate', result: 'Result',
    })[screen] || 'Bill Splitter';
    ({
      home: bindHome, bill: bindBill, people: bindPeople,
      allocate: bindAllocate, result: bindResult,
    })[screen]();
  }

  // ============================================================
  // HOME
  // ============================================================
  function bindHome() {
    $('#newBillBtn').addEventListener('click', () => {
      App.bill = Store.blankBill();
      // seed: empty people list — user will add
      setBill(App.bill);
      go('bill');
    });
    $('#scanBillBtn').addEventListener('click', () => $('#scanInput').click());
    $('#scanInput').addEventListener('change', onScanFile);

    const list = $('#savedList');
    const bills = Store.loadBills();
    if (bills.length === 0) {
      list.innerHTML = '<div class="empty">No saved bills yet. Tap <b>+ New Bill</b> to begin, or <b>Scan Bill</b> to import a photo or PDF.</div>';
      return;
    }
    list.innerHTML = '';
    bills.forEach((b) => {
      const calc = Calc.compute(b);
      const row  = document.createElement('div');
      row.className = 'saved-row';
      const date = b.meta.billDate || new Date(b.createdAt).toISOString().slice(0, 10);
      row.innerHTML = `
        <div class="meta">
          <div class="title">${esc(b.meta.restName || 'Untitled')}</div>
          <div class="sub">${esc(date)} · ${b.people.length} ppl · ${b.items.length} items</div>
        </div>
        <div class="amt">${fmtINR(calc.grand.total)}</div>
        <button class="del" aria-label="Delete">&times;</button>`;
      row.addEventListener('click', (e) => {
        if (e.target.classList.contains('del')) {
          if (confirm('Delete this bill?')) { Store.deleteBill(b.id); bindHome(); }
          return;
        }
        setBill(b); go('bill');
      });
      list.appendChild(row);
    });
  }

  async function onScanFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = ''; // reset
    const settings = Store.loadSettings();
    if (!settings.apiKey) {
      promptForApiKey(() => onScanFileResume(file));
      return;
    }
    await onScanFileResume(file);
  }

  async function onScanFileResume(file) {
    const settings = Store.loadSettings();
    const m = openModal(`<h3>Scanning bill…</h3><div class="spinner"></div><p class="muted" style="text-align:center;margin:0">Reading items from your image. This may take 10–20 seconds.</p>`);
    try {
      const parsed = await OCR.extractFromFile(file, settings.apiKey);
      const bill = Store.blankBill();
      bill.meta = Object.assign(bill.meta, parsed.meta || {});
      bill.taxes = Object.assign(bill.taxes, parsed.taxes || {});
      bill.items = (parsed.items || []).map((it) => ({
        id: Store.uid(),
        name: String(it.name || ''),
        rate: +it.rate || 0,
        qty:  +it.qty  || 1,
        amount: +it.amount || 0,
        section: ['food', 'liquor', 'other'].includes(it.section) ? it.section : 'food',
      }));
      setBill(bill);
      m.close();
      toast('Scanned ' + bill.items.length + ' items — review and continue.');
      go('bill');
    } catch (err) {
      m.close();
      alert('Scan failed: ' + (err.message || err));
    }
  }

  function promptForApiKey(after) {
    const settings = Store.loadSettings();
    const m = openModal(`
      <h3>Add Anthropic API key</h3>
      <p class="muted" style="margin:0">Scanning uses Claude's vision API. Your key is stored only on this device (localStorage).
      Get one at <b>console.anthropic.com</b>.</p>
      <label class="field"><span>API key</span><input id="apiKeyInput" type="password" placeholder="sk-ant-…" value="${esc(settings.apiKey || '')}" /></label>
      <div class="modal-actions">
        <button class="ghost" id="cancelKey">Cancel</button>
        <button class="primary" id="saveKey">Save</button>
      </div>`);
    $('#cancelKey', m.box).addEventListener('click', m.close);
    $('#saveKey', m.box).addEventListener('click', () => {
      const v = $('#apiKeyInput', m.box).value.trim();
      if (!v) return toast('Enter a key first.');
      Store.saveSettings(Object.assign(settings, { apiKey: v }));
      m.close();
      if (typeof after === 'function') after();
    });
  }

  // ============================================================
  // BILL (items + tax)
  // ============================================================
  function bindBill() {
    const b = App.bill;
    $('#restName').value  = b.meta.restName || '';
    $('#restSub').value   = b.meta.restSub  || '';
    $('#billNo').value    = b.meta.billNo   || '';
    $('#billDate').value  = b.meta.billDate || '';
    $('#billTable').value = b.meta.billTable|| '';
    $('#billHall').value  = b.meta.billHall || '';
    $('#taxCgst').value   = b.taxes.cgst ?? '';
    $('#taxSgst').value   = b.taxes.sgst ?? '';
    $('#taxVat').value    = b.taxes.vat  ?? '';

    const writeMeta = (k, v) => { b.meta[k] = v; persist(); refreshTotals(); };
    $('#restName').addEventListener('input',  (e) => writeMeta('restName',  e.target.value));
    $('#restSub').addEventListener('input',   (e) => writeMeta('restSub',   e.target.value));
    $('#billNo').addEventListener('input',    (e) => writeMeta('billNo',    e.target.value));
    $('#billDate').addEventListener('change', (e) => writeMeta('billDate',  e.target.value));
    $('#billTable').addEventListener('input', (e) => writeMeta('billTable', e.target.value));
    $('#billHall').addEventListener('input',  (e) => writeMeta('billHall',  e.target.value));
    $('#taxCgst').addEventListener('input',   (e) => { b.taxes.cgst = +e.target.value || 0; persist(); refreshTotals(); });
    $('#taxSgst').addEventListener('input',   (e) => { b.taxes.sgst = +e.target.value || 0; persist(); refreshTotals(); });
    $('#taxVat').addEventListener('input',    (e) => { b.taxes.vat  = +e.target.value || 0; persist(); refreshTotals(); });

    $$('#sectionSeg .seg-btn').forEach((btn) => btn.addEventListener('click', () => {
      $$('#sectionSeg .seg-btn').forEach((x) => x.classList.toggle('active', x === btn));
      App.section = btn.dataset.section;
      renderItems();
    }));
    $('#addItemBtn').addEventListener('click', addItem);
    renderItems();
    refreshTotals();
  }

  function renderItems() {
    const wrap = $('#itemList'); wrap.innerHTML = '';
    const list = App.bill.items.filter((i) => i.section === App.section);
    if (list.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'No items in this section yet. Tap "+ Add Item".';
      wrap.appendChild(e);
      return;
    }
    list.forEach((it) => wrap.appendChild(itemRow(it)));
  }

  function itemRow(it) {
    const node = $('#tpl-item-row').content.firstElementChild.cloneNode(true);
    node.dataset.id = it.id;
    const nameI = $('.it-name', node); const rateI = $('.it-rate', node);
    const qtyI  = $('.it-qty', node);  const amtI  = $('.it-amt', node);
    nameI.value = it.name || '';
    rateI.value = it.rate ?? '';
    qtyI.value  = it.qty  ?? 1;
    amtI.value  = it.amount || (Calc.itemTotal(it) || '');

    nameI.addEventListener('input', () => { it.name = nameI.value; persist(); });
    const recomputeAmt = () => {
      const auto = (+rateI.value || 0) * (+qtyI.value || 0);
      if (!it._amountTouched) { amtI.value = auto ? Calc.round2(auto) : ''; it.amount = 0; }
      else it.amount = +amtI.value || 0;
      it.rate = +rateI.value || 0; it.qty = +qtyI.value || 0;
      persist(); refreshTotals();
    };
    rateI.addEventListener('input', recomputeAmt);
    qtyI.addEventListener('input',  recomputeAmt);
    amtI.addEventListener('input', () => {
      it._amountTouched = true; it.amount = +amtI.value || 0;
      persist(); refreshTotals();
    });
    $('.delbtn', node).addEventListener('click', () => {
      App.bill.items = App.bill.items.filter((x) => x.id !== it.id);
      delete App.bill.allocations[it.id];
      persist(); renderItems(); refreshTotals();
    });
    return node;
  }

  function addItem() {
    const it = { id: Store.uid(), name: '', rate: 0, qty: 1, amount: 0, section: App.section };
    App.bill.items.push(it);
    persist(); renderItems(); refreshTotals();
    setTimeout(() => {
      const last = $$('#itemList .item-row').pop();
      if (last) last.querySelector('.it-name').focus();
    }, 50);
  }

  function refreshTotals() {
    if (!$('#totalsCard')) return;
    const b = App.bill;
    const food   = sumSection(b, 'food');
    const liquor = sumSection(b, 'liquor');
    const other  = sumSection(b, 'other');
    const cgst  = Calc.round2(food   * (b.taxes.cgst || 0) / 100);
    const sgst  = Calc.round2(food   * (b.taxes.sgst || 0) / 100);
    const vat   = Calc.round2(liquor * (b.taxes.vat  || 0) / 100);
    const grand = Calc.round2(food + liquor + other + cgst + sgst + vat);
    $('#totalsCard').innerHTML = `
      <div class="tline"><span>Food subtotal</span><span>${fmtINR(food)}</span></div>
      <div class="tline"><span>Liquor subtotal</span><span>${fmtINR(liquor)}</span></div>
      <div class="tline"><span>Others subtotal</span><span>${fmtINR(other)}</span></div>
      <div class="tline"><span>Food CGST ${b.taxes.cgst || 0}%</span><span>${fmtINR(cgst)}</span></div>
      <div class="tline"><span>Food SGST ${b.taxes.sgst || 0}%</span><span>${fmtINR(sgst)}</span></div>
      <div class="tline"><span>Liquor VAT ${b.taxes.vat || 0}%</span><span>${fmtINR(vat)}</span></div>
      <div class="tline grand"><span>Grand Total</span><span>${fmtINR(grand)}</span></div>`;
  }
  function sumSection(b, sec) {
    return Calc.round2((b.items || [])
      .filter((i) => i.section === sec)
      .reduce((s, i) => s + Calc.itemTotal(i), 0));
  }

  // ============================================================
  // PEOPLE
  // ============================================================
  function bindPeople() {
    $('#addPersonBtn').addEventListener('click', addPerson);
    renderPeople();
  }
  function renderPeople() {
    const wrap = $('#peopleList'); wrap.innerHTML = '';
    if (App.bill.people.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'No people added yet. Tap "+ Add Person".';
      wrap.appendChild(e);
      return;
    }
    App.bill.people.forEach((p, i) => wrap.appendChild(personRow(p, i)));
  }
  function personRow(p, i) {
    const node = $('#tpl-person-row').content.firstElementChild.cloneNode(true);
    node.dataset.id = p.id;
    const chip = $('.color-chip', node);
    chip.style.background = colorFor(p.color, i);
    const nameI = $('.pname', node);
    nameI.value = p.name || '';
    nameI.addEventListener('input', () => { p.name = nameI.value; persist(); });
    chip.addEventListener('click', () => pickColor(p, () => renderPeople()));
    $('.delbtn', node).addEventListener('click', () => {
      App.bill.people = App.bill.people.filter((x) => x.id !== p.id);
      // remove this person from every allocation
      Object.values(App.bill.allocations).forEach((a) => { if (a && a.values) delete a.values[p.id]; });
      persist(); renderPeople();
    });
    return node;
  }
  function addPerson() {
    const i = App.bill.people.length;
    const p = { id: Store.uid(), name: '', color: PALETTE[i % PALETTE.length] };
    App.bill.people.push(p);
    persist(); renderPeople();
    setTimeout(() => {
      const last = $$('#peopleList .person-row').pop();
      if (last) last.querySelector('.pname').focus();
    }, 50);
  }
  function pickColor(p, after) {
    const m = openModal(`
      <h3>Pick a color</h3>
      <div class="swatches">
        ${PALETTE.map((slot) => `<button class="swatch" data-slot="${slot}" style="background:${PALETTE_HEX[slot]}"></button>`).join('')}
      </div>
      <div class="modal-actions"><button class="ghost" id="closePick">Close</button></div>`);
    $('#closePick', m.box).addEventListener('click', m.close);
    $$('.swatch', m.box).forEach((b) => b.addEventListener('click', () => {
      p.color = b.dataset.slot; persist(); m.close(); after && after();
    }));
  }

  // ============================================================
  // ALLOCATE
  // ============================================================
  function bindAllocate() {
    if (App.bill.people.length === 0) {
      $('#allocList').innerHTML = '<div class="empty">Add people first.</div>';
      $('#runningTotals').innerHTML = '';
      return;
    }
    if (App.bill.items.length === 0) {
      $('#allocList').innerHTML = '<div class="empty">Add items first.</div>';
      $('#runningTotals').innerHTML = '';
      return;
    }
    renderAllocCards();
    renderRunningTotals();
  }

  function renderAllocCards() {
    const wrap = $('#allocList'); wrap.innerHTML = '';
    App.bill.items.forEach((it) => wrap.appendChild(allocCard(it)));
  }

  function allocCard(it) {
    const node = $('#tpl-alloc-card').content.firstElementChild.cloneNode(true);
    node.dataset.id = it.id;
    $('.alloc-name', node).textContent = (it.name || '(untitled)') + '  · ' + (it.section).toUpperCase();
    $('.alloc-amt',  node).textContent = fmtINR(Calc.itemTotal(it));
    const ruleSel = $('.alloc-rule', node);
    const peopleWrap = $('.alloc-people', node);
    const status = $('.alloc-status', node);

    if (!App.bill.allocations[it.id]) {
      // default: equal split across everyone
      App.bill.allocations[it.id] = { rule: 'equal', values: Object.fromEntries(App.bill.people.map((p) => [p.id, 1])) };
    }
    const alloc = App.bill.allocations[it.id];
    ruleSel.value = alloc.rule;
    renderRule();

    ruleSel.addEventListener('change', () => {
      alloc.rule = ruleSel.value;
      // reset values sensibly when rule changes
      if (alloc.rule === 'equal')    alloc.values = Object.fromEntries(App.bill.people.map((p) => [p.id, 1]));
      if (alloc.rule === 'assigned') alloc.values = Object.fromEntries([[App.bill.people[0].id, 1]]);
      if (alloc.rule === 'percent')  alloc.values = Object.fromEntries(App.bill.people.map((p) => [p.id, Math.round(100 / App.bill.people.length)]));
      if (alloc.rule === 'amount') {
        const total = Calc.itemTotal(it);
        const each  = Calc.round2(total / App.bill.people.length);
        alloc.values = Object.fromEntries(App.bill.people.map((p) => [p.id, each]));
      }
      persist(); renderRule(); renderRunningTotals();
    });

    function renderRule() {
      peopleWrap.innerHTML = '';
      App.bill.people.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'alloc-prow';
        const chip = document.createElement('span'); chip.className = 'pchip';
        chip.style.background = colorFor(p.color, i);
        const name = document.createElement('span'); name.className = 'pname'; name.textContent = p.name || '(no name)';
        row.appendChild(chip); row.appendChild(name);

        if (alloc.rule === 'equal') {
          if (alloc.values[p.id]) chip.classList.add('on');
          chip.addEventListener('click', () => {
            alloc.values[p.id] = alloc.values[p.id] ? 0 : 1;
            persist(); renderRule(); renderRunningTotals();
          });
          const share = document.createElement('span'); share.className = 'pshare';
          const shares = Calc.splitItem(it, alloc, App.bill.people);
          share.textContent = fmtINR(shares[p.id] || 0);
          row.appendChild(share);
        }
        else if (alloc.rule === 'assigned') {
          const onId = Object.keys(alloc.values).find((k) => alloc.values[k]);
          if (onId === p.id) chip.classList.add('on');
          chip.addEventListener('click', () => {
            alloc.values = { [p.id]: 1 };
            persist(); renderRule(); renderRunningTotals();
          });
          const share = document.createElement('span'); share.className = 'pshare';
          share.textContent = onId === p.id ? fmtINR(Calc.itemTotal(it)) : '—';
          row.appendChild(share);
        }
        else if (alloc.rule === 'percent') {
          const input = document.createElement('input');
          input.className = 'pinput'; input.type = 'number'; input.step = '0.5';
          input.value = alloc.values[p.id] || 0;
          input.addEventListener('input', () => {
            alloc.values[p.id] = +input.value || 0;
            persist(); renderRunningTotals();
            updateAllocStatus();
          });
          row.appendChild(input);
          const suffix = document.createElement('span'); suffix.className = 'pshare';
          suffix.textContent = '%';
          row.appendChild(suffix);
        }
        else if (alloc.rule === 'amount') {
          const input = document.createElement('input');
          input.className = 'pinput'; input.type = 'number'; input.step = '0.5'; input.inputMode = 'decimal';
          input.value = alloc.values[p.id] || 0;
          input.addEventListener('input', () => {
            alloc.values[p.id] = +input.value || 0;
            persist(); renderRunningTotals();
            updateAllocStatus();
          });
          row.appendChild(input);
        }
        peopleWrap.appendChild(row);
      });
      updateAllocStatus();
    }

    function updateAllocStatus() {
      const total = Calc.itemTotal(it);
      if (alloc.rule === 'percent') {
        const s = Object.values(alloc.values || {}).reduce((s, v) => s + (+v || 0), 0);
        status.classList.toggle('warn', Math.abs(s - 100) >= 0.5);
        status.classList.toggle('ok',   Math.abs(s - 100) <  0.5);
        status.textContent = 'Sum: ' + s + '% ' + (Math.abs(s - 100) < 0.5 ? '✓' : '(should be 100%)');
      } else if (alloc.rule === 'amount') {
        const s = Calc.round2(Object.values(alloc.values || {}).reduce((s, v) => s + (+v || 0), 0));
        status.classList.toggle('warn', Math.abs(s - total) >= 0.5);
        status.classList.toggle('ok',   Math.abs(s - total) <  0.5);
        status.textContent = 'Sum: ' + fmtINR(s) + ' / ' + fmtINR(total) + (Math.abs(s - total) < 0.5 ? ' ✓' : ' (must match item total)');
      } else {
        status.textContent = '';
        status.classList.remove('warn', 'ok');
      }
    }

    return node;
  }

  function renderRunningTotals() {
    const wrap = $('#runningTotals'); if (!wrap) return;
    const calc = Calc.compute(App.bill);
    let html = '';
    App.bill.people.forEach((p, i) => {
      html += `<div class="rrow"><span><span class="pchip" style="background:${colorFor(p.color, i)}"></span>${esc(p.name || '(no name)')}</span><b>${fmtINR(calc.grand.perPerson[p.id] || 0)}</b></div>`;
    });
    html += `<div class="rrow" style="border-top:1px solid #e5e7eb;margin-top:6px;padding-top:8px;"><b>Grand Total</b><b>${fmtINR(calc.grand.total)}</b></div>`;
    wrap.innerHTML = html;
  }

  // ============================================================
  // RESULT (render + export)
  // ============================================================
  function bindResult() {
    const warnings = Calc.validate(App.bill);
    if (warnings.length > 0) {
      $('#resultView').innerHTML = '<div class="empty"><b>Fix the following:</b><br/>' + warnings.map(esc).join('<br/>') + '</div>';
      return;
    }
    $$('#resultSeg .seg-btn').forEach((btn) => btn.addEventListener('click', () => {
      $$('#resultSeg .seg-btn').forEach((x) => x.classList.toggle('active', x === btn));
      App.resultView = btn.dataset.view; renderResult();
    }));
    renderResult();
    $('#exportPdf').addEventListener('click',  () => doExport('pdf'));
    $('#exportPng').addEventListener('click',  () => doExport('png'));
    $('#exportHtml').addEventListener('click', () => doExport('html'));
    $('#exportShare').addEventListener('click', async () => {
      const calc = Calc.compute(App.bill);
      const r = await Exporter.shareSummary(App.bill, calc);
      if (r === 'copied') toast('Summary copied to clipboard.');
    });
  }

  async function doExport(kind) {
    const calc = Calc.compute(App.bill);
    const fns  = { renderMaster, renderPerPerson, renderQuickPay };
    try {
      if (kind === 'pdf')      { toast('Building PDF…');  await Exporter.exportPdf(App.bill,  calc, fns); }
      else if (kind === 'png') { toast('Building PNG…');  await Exporter.exportPng(App.bill,  calc, fns); }
      else if (kind === 'html'){ Exporter.exportHtml(App.bill, calc, fns); toast('HTML downloaded.'); }
    } catch (e) {
      alert('Export failed: ' + (e.message || e));
    }
  }

  function renderResult() {
    const calc = Calc.compute(App.bill);
    const view = App.resultView;
    if (view === 'master')   $('#resultView').innerHTML = renderMaster(App.bill, calc);
    if (view === 'person')   $('#resultView').innerHTML = renderPerPerson(App.bill, calc);
    if (view === 'quickpay') $('#resultView').innerHTML = renderQuickPay(App.bill, calc);
  }

  // ============== Renderers (also used by Exporter) ==============

  function metaLine(b) {
    const bits = [];
    if (b.meta.billNo)    bits.push('Bill: ' + b.meta.billNo);
    if (b.meta.billDate)  bits.push('Date: ' + b.meta.billDate);
    if (b.meta.billTable) bits.push('Table: ' + b.meta.billTable);
    if (b.meta.billHall)  bits.push(b.meta.billHall);
    return bits.join('  |  ');
  }

  function renderMaster(b, calc, opts) {
    const forExport = !!(opts && opts.forExport);
    const people = b.people;
    const npeople = people.length;
    const groups = { food: [], liquor: [], other: [] };
    b.items.forEach((it) => groups[it.section || 'food'].push(it));

    const colsHeader = people.map((p, i) =>
      `<th class="num h-${slotIndex(p.color, i)}" style="${forExport ? `color:${colorFor(p.color, i)}` : ''}">${esc(p.name || ('P' + (i + 1)))} (₹)</th>`
    ).join('');

    let html = '';
    html += `<div class="ttl-band">${esc(b.meta.restName || 'BILL')}${b.meta.restSub ? ' — ' + esc(b.meta.restSub) : ''} &middot; Bill Split (${npeople} People)</div>`;
    html += `<div class="sub-band"><span>${people.map((p) => esc(p.name || '?')).join(' | ')}</span><span>${esc(metaLine(b))}</span></div>`;
    html += `<table><thead><tr>
      <th>Item</th><th class="num">Rate</th><th class="num">Qty</th><th class="num">Total (₹)</th>
      ${colsHeader}
      <th>Split Rule</th>
    </tr></thead><tbody>`;

    function groupRows(title, list, klass) {
      if (list.length === 0) return '';
      let s = `<tr><td colspan="${4 + npeople + 1}" class="grp ${klass || ''}">${title}</td></tr>`;
      list.forEach((it) => {
        const shares = calc.itemShares[it.id] || {};
        const tot    = calc.itemTotals[it.id] || 0;
        s += `<tr>
          <td>${esc(it.name)}</td>
          <td class="num">${fmt(it.rate)}</td>
          <td class="num">${it.qty}</td>
          <td class="num">${fmt(tot)}</td>
          ${people.map((p, i) => `<td class="num" style="${forExport ? `color:${colorFor(p.color, i)}` : ''}">${shares[p.id] ? fmt(shares[p.id]) : '-'}</td>`).join('')}
          <td><i style="color:#6b7280">${esc(calc.itemRules[it.id] || '')}</i></td>
        </tr>`;
      });
      return s;
    }

    html += groupRows('🍽 FOOD (Pre-tax)',    groups.food, 'food');
    html += groupRows('🥃 LIQUOR (Pre-tax)',  groups.liquor, 'liquor');
    html += groupRows('📋 OTHERS',            groups.other, 'other');

    // Tax rows
    const tx = calc.taxByPerson;
    function taxRow(label, perPersonField, totalField) {
      return `<tr class="tax-row">
        <td colspan="3">${label}</td>
        <td class="num">${fmt(calc.taxTotals[totalField])}</td>
        ${people.map((p) => `<td class="num">${fmt(tx[p.id][perPersonField])}</td>`).join('')}
        <td><i style="color:#6b7280">Proportional to pre-tax share</i></td>
      </tr>`;
    }
    html += taxRow('Food CGST @ ' + b.taxes.cgst + '%', 'foodCgst',  'foodCgst');
    html += taxRow('Food SGST @ ' + b.taxes.sgst + '%', 'foodSgst',  'foodSgst');
    html += taxRow('Liquor VAT @ ' + b.taxes.vat + '%', 'liquorVat', 'liquorVat');

    // Grand total row
    html += `<tr class="grand-row">
      <td colspan="3">★ GRAND TOTAL (₹)</td>
      <td class="num">${fmt(calc.grand.total)}</td>
      ${people.map((p) => `<td class="num">${fmt(calc.grand.perPerson[p.id])}</td>`).join('')}
      <td>Total: ₹${fmt(calc.grand.total)}</td>
    </tr>`;

    html += `</tbody></table>`;
    html += `<div class="ftr">Note: Tax shares are proportional to each person's pre-tax section share. Minor rounding in individual shares is normal.</div>`;
    return `<div class="rpt">${html}</div>`;
  }

  function renderPerPerson(b, calc, opts) {
    const forExport = !!(opts && opts.forExport);
    const people = b.people;
    let html = '';
    html += `<div class="rpt"><div class="ttl-band">BILL SPLIT — PER PERSON SUMMARY</div>`;
    html += `<div class="sub-band"><span>${esc((b.meta.restName || '') + (b.meta.restSub ? ' · ' + b.meta.restSub : ''))}</span><span>${esc(metaLine(b))}</span></div></div>`;

    people.forEach((p, i) => {
      const idx = slotIndex(p.color, i);
      const hex = colorFor(p.color, i);
      const bgx = bgFor(p.color, i);

      let rows = '';
      let subtotalPre = 0;
      b.items.forEach((it) => {
        const share = (calc.itemShares[it.id] || {})[p.id] || 0;
        if (share <= 0) return;
        subtotalPre += share;
        const ruleNote = noteForRule(b.allocations[it.id], it, p);
        rows += `<tr>
          <td>${esc(it.name)}</td>
          <td class="num">${fmt(share)}</td>
          <td><i style="color:#6b7280">${esc(ruleNote)}</i></td>
        </tr>`;
      });
      const t = calc.taxByPerson[p.id];
      if (t.foodCgst > 0)  rows += `<tr><td>Food CGST ${b.taxes.cgst}%</td><td class="num">${fmt(t.foodCgst)}</td><td><i style="color:#6b7280">Proportional</i></td></tr>`;
      if (t.foodSgst > 0)  rows += `<tr><td>Food SGST ${b.taxes.sgst}%</td><td class="num">${fmt(t.foodSgst)}</td><td><i style="color:#6b7280">Proportional</i></td></tr>`;
      if (t.liquorVat > 0) rows += `<tr><td>Liquor VAT ${b.taxes.vat}%</td><td class="num">${fmt(t.liquorVat)}</td><td><i style="color:#6b7280">Proportional</i></td></tr>`;
      const tot = calc.grand.perPerson[p.id] || 0;

      const bandStyle = forExport ? `background:${hex}` : '';
      const totStyle  = forExport ? `background:${bgx};color:${hex}` : '';

      html += `<div class="rpt pcard-${idx}" style="margin-top:14px">
        <div class="person-band pband-${idx}" style="${bandStyle}">👤 ${esc((p.name || 'Person').toUpperCase())}</div>
        <table>
          <thead><tr><th>Charge</th><th class="num">Amount (₹)</th><th>Notes</th></tr></thead>
          <tbody>
            ${rows || '<tr><td colspan="3" style="color:#94a3b8;text-align:center">No charges</td></tr>'}
            <tr class="person-total"><td style="${totStyle}">TOTAL — ${esc(p.name || 'Person')}</td><td class="num" style="${totStyle}">${fmt(tot)}</td><td style="${totStyle}"></td></tr>
          </tbody>
        </table>
      </div>`;
    });

    // Grand-total footer card
    html += `<div class="rpt" style="margin-top:14px"><table><tr class="grand-row">
      <td>★ GRAND TOTAL</td><td class="num">${fmt(calc.grand.total)}</td>
    </tr></table></div>`;
    return html;
  }

  function noteForRule(alloc, it, p) {
    if (!alloc) return 'Equal ÷ all';
    if (alloc.rule === 'equal') {
      const selected = Object.keys(alloc.values || {}).filter((k) => alloc.values[k]).length;
      return 'Equal ÷ ' + selected;
    }
    if (alloc.rule === 'assigned') return 'Assigned';
    if (alloc.rule === 'percent')  return 'Custom %';
    if (alloc.rule === 'amount')   return 'Custom split';
    return '';
  }

  function renderQuickPay(b, calc, opts) {
    const forExport = !!(opts && opts.forExport);
    const people = b.people;
    let html = `<div class="rpt"><div class="ttl-band">💳 QUICK PAY CARD — ${esc(b.meta.restName || '')}</div>`;
    html += `<div class="sub-band">${b.meta.billNo ? 'No: ' + esc(b.meta.billNo) : ''} ${b.meta.billTable ? '| Table ' + esc(b.meta.billTable) : ''} ${b.meta.billDate ? '| ' + esc(b.meta.billDate) : ''} | Grand Total: ${fmtINR(calc.grand.total)}</div>`;

    html += `<div class="qp">
      <div class="qp-head"><div>Name</div><div>Amount to Pay (₹)</div><div>Rounded</div></div>`;
    people.forEach((p, i) => {
      const amt = calc.grand.perPerson[p.id] || 0;
      const idx = slotIndex(p.color, i);
      const bgx = bgFor(p.color, i);
      const hex = colorFor(p.color, i);
      const rowStyle = forExport ? `background:${bgx};color:${hex}` : '';
      html += `<div class="qp-row" style="${rowStyle}">
        <div class="qp-name">${esc(p.name || ('P' + (i + 1)))}</div>
        <div class="qp-amt">${fmt(amt)}</div>
        <div class="qp-round">${Math.round(amt).toLocaleString('en-IN')}</div>
      </div>`;
    });
    html += `<div class="qp-row qp-total">
      <div class="qp-name">TOTAL</div>
      <div class="qp-amt">${fmt(calc.grand.total)}</div>
      <div class="qp-round">${Math.round(calc.grand.total).toLocaleString('en-IN')}</div>
    </div>`;
    html += `</div></div>`;
    return html;
  }

  // ============================================================
  // Menu (API key, clear data)
  // ============================================================
  function openMenu() {
    const settings = Store.loadSettings();
    const m = openModal(`
      <h3>Settings</h3>
      <button class="primary" id="setKey">Set Anthropic API key</button>
      <button class="ghost"   id="clrCurrent">Discard current bill</button>
      <button class="ghost"   id="clrAll" style="border-color:#dc2626;color:#dc2626">Clear all data</button>
      <div class="modal-actions"><button class="ghost" id="closeMenu">Close</button></div>
      <p class="muted" style="font-size:11px;margin:0">Bills are stored locally on this device. API key (if set) is used only to call Anthropic from your browser.</p>`);
    $('#closeMenu', m.box).addEventListener('click', m.close);
    $('#setKey', m.box).addEventListener('click', () => { m.close(); promptForApiKey(); });
    $('#clrCurrent', m.box).addEventListener('click', () => {
      if (confirm('Discard the current bill (saved bills remain)?')) {
        Store.saveCurrent(null); App.bill = null; m.close(); go('home');
      }
    });
    $('#clrAll', m.box).addEventListener('click', () => {
      if (confirm('Delete ALL bills and settings from this device?')) {
        localStorage.clear(); App.bill = null; m.close(); go('home');
      }
    });
  }

  // ============================================================
  // Boot
  // ============================================================
  window.addEventListener('DOMContentLoaded', () => {
    $$('.navbtn').forEach((b) => b.addEventListener('click', () => go(b.dataset.screen)));
    $('#backBtn').addEventListener('click', () => go('home'));
    $('#menuBtn').addEventListener('click', openMenu);

    App.bill = Store.loadCurrent();
    go(App.bill ? 'home' : 'home');

    // Register PWA service worker (optional; ignored when not served over https)
    /* SW disabled in single-file build */
  });
})();

</script>
</body>
</html>
